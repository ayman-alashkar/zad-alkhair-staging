:root{
  /* Zād al-Khayr design tokens — aligned with the approved index-final-v7 identity */
  --brand:#0F5C50; --brand-strong:#0A473E; --brand-soft:#DDF1EA;
  --green:#1B705F; --green-deep:#0A473E; --green-hi:#278573;
  --gold:#C59A4A; --gold-hi:#E4C980; --gold-soft:#F4E8CA; --red:#B95157;
  --paper:#F5F0E4; --quran:#132823; --muted:#746F63;
  --chrome:#FFFCF4; --chrome-text:#18362F; --border:#DED3BD; --line:#DED3BD;
  --select:rgba(40,122,101,.12); --select-line:rgba(197,154,74,.30);
  --sheet:#FFFCF4; --shadow:rgba(0,0,0,.18);
  --surah-banner:#082D29;
  --ui-surface:#FFFCF4; --ui-surface-2:#F5F0E4; --ui-surface-3:#EAE1CF;
  --ui-text:#132823; --ui-muted:#746F63; --ui-line:#DED3BD;
  --ui-accent:#287A65; --ui-accent-soft:#E3EFE8; --ui-gold:#C59A4A;
  --night:#082D29; --night-2:#0D3C35; --night-3:#155449; --ivory:#FFF9EA;
}
html[data-theme="dark"]{
  /* الوضع الليلي مأخوذ من خلفية وهوية النسخة النهائية لزاد الخير */
  --green:#49A18C; --green-deep:#0A473E; --green-hi:#49A18C;
  --gold:#C59A4A; --gold-hi:#E4C980; --gold-soft:rgba(228,201,128,.12); --red:#D77B80;
  --paper:#061F1D; --quran:#FFF9EA; --muted:rgba(255,249,234,.70);
  --chrome:#082D29; --chrome-text:#FFF9EA; --border:rgba(228,201,128,.24); --line:rgba(228,201,128,.24);
  --select:rgba(73,161,140,.18); --select-line:rgba(228,201,128,.28);
  --sheet:#0D3C35; --shadow:rgba(0,0,0,.48);
  --surah-banner:#E4C980;
  --ui-surface:#0D3C35; --ui-surface-2:#082D29; --ui-surface-3:#155449;
  --ui-text:#FFF9EA; --ui-muted:rgba(255,249,234,.70); --ui-line:rgba(228,201,128,.22);
  --ui-accent:#49A18C; --ui-accent-soft:rgba(73,161,140,.13); --ui-gold:#C59A4A;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);font-family:Alexandria,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,select{font:inherit}
button{cursor:pointer}

/* ---------- Mushaf ---------- */
.reader{position:fixed;inset:0;background:var(--paper);overflow:hidden}
.track{
  position:absolute;left:0;top:0;width:60400vw;height:100%;
  display:flex;flex-direction:row-reverse;direction:ltr;
  will-change:transform;transition:transform .31s cubic-bezier(.2,.78,.2,1);
  touch-action:pan-y;
}
.page{
  flex:0 0 100vw;width:100vw;height:100%;direction:rtl;position:relative;
  background:var(--paper);color:var(--quran);overflow:hidden;
  padding:calc(18px + env(safe-area-inset-top)) 2px calc(18px + env(safe-area-inset-bottom));
}
.page-meta{
  position:absolute;z-index:3;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;
  height:25px;display:flex;justify-content:space-between;align-items:flex-start;
  padding-inline:3px;color:var(--muted);font-family:"Aref Ruqaa",serif;font-size:16px;
}
.page-meta-link{
  appearance:none;-webkit-appearance:none;border:0;background:transparent;padding:0;margin:0;
  color:inherit;font:inherit;line-height:inherit;cursor:pointer;touch-action:manipulation;
  border-radius:7px;transition:color .16s ease,background .16s ease,transform .12s ease;
}
.page-meta-link:active{transform:scale(.96);color:var(--gold)}
.page-meta-link:focus-visible{outline:2px solid color-mix(in srgb,var(--gold) 55%,transparent);outline-offset:3px}
.page-stage{
  position:absolute;
  inset:calc(43px + env(safe-area-inset-top)) 0 calc(34px + env(safe-area-inset-bottom));
  display:flex;justify-content:center;overflow:hidden;
}
.page-stage.special{align-items:center}
.page-stage.full{align-items:center;padding-top:0}
.mushaf{
  width:min(99.2vw,780px);max-width:100%;height:100%;direction:rtl;
  display:flex;flex-direction:column;align-items:stretch;justify-content:center;
  transform-origin:center center;
}
.line{
  width:100%;display:flex;justify-content:center;align-items:center;
  white-space:nowrap;overflow:visible;direction:rtl;line-height:1.33;
}
.line-inner{
  display:inline-flex;align-items:center;justify-content:center;
  user-select:none;-webkit-user-select:none;
  direction:rtl;white-space:nowrap;line-height:1.33;
  font-family:"QCF4_Hafs_01";
}
.surah-line{
  font-family:"QCF4_QBSML";color:var(--green);
  line-height:1.08;min-height:1.12em;margin-bottom:.12em;
  position:relative;overflow:visible;
}
/* QUL surah header is rendered to a cropped canvas overlay. The hidden
   QCF4 title underneath preserves the original Mushaf line box, so the
   decorative header can never change ayah size, spacing, or page fitting. */
.surah-line.banner-ready{width:100%;}
.surah-metric{
  font-family:"QCF4_QBSML";visibility:hidden;white-space:nowrap;
}
.surah-banner{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:block;width:min(94vw,735px);max-width:96%;height:auto;
  pointer-events:none;user-select:none;-webkit-user-select:none;opacity:.94;
}
/* Keep every Surah header in its original line box. Only Al-Fatiha gets a
   very small visual lift; this does not affect Mushaf fitting or line height. */
.page[data-page="1"] .surah-banner{
  transform:translate(-50%,-50%) translateY(-4px);
}
html[data-theme="dark"] .surah-banner{opacity:.88}
html[data-theme="dark"] .surah-line{color:#57b7a0}
/* Visual nudge only: move the Bismillah a little lower without changing
   the QCF line metrics used by fitPage(). */
.bismillah-line{font-family:"QCF4_Hafs_01";line-height:1.25;margin:.04em 0 .12em;position:relative;color:var(--quran);transform:translateY(3px)}
.bismillah-original{display:inline}.bismillah-desktop{display:none}
.verse-segment{
  display:inline-flex;direction:rtl;align-items:center;
  user-select:none;-webkit-user-select:none;touch-action:pan-y;
  border-radius:.18em;box-shadow:0 0 0 1px transparent inset;
  transition:background .13s,box-shadow .13s;
}
.verse-segment.selected{background:var(--select);box-shadow:0 0 0 1px var(--select-line) inset}
.word{
  display:inline-block;direction:rtl;color:var(--quran);
  line-height:1.33;position:relative;
}
.word.allah{color:var(--red)}
.word.end{color:var(--quran)}
html:not([data-theme="dark"]) .word.end{color:var(--gold)}
.page-no{
  position:absolute;left:22px;bottom:calc(12px + env(safe-area-inset-bottom));
  color:var(--muted);font-family:"Aref Ruqaa",serif;font-size:17px
}
.qcf-mark{
  position:absolute;right:50%;transform:translateX(50%);
  bottom:calc(11px + env(safe-area-inset-bottom));
  color:var(--muted);font-size:8px;opacity:.48
}
.loading{
  position:fixed;inset:0;z-index:70;display:grid;place-items:center;
  background:var(--paper);color:var(--muted);font-size:11px;
}
.loading.hide{display:none}
.loading-error{display:grid;gap:12px;place-items:center;text-align:center;padding:24px;max-width:430px;line-height:1.8}
.loading-retry{border:1px solid var(--border);background:var(--brand);color:#fff;border-radius:12px;padding:9px 16px;font:600 12px Alexandria,system-ui,sans-serif}
.loading-retry:active{transform:scale(.97)}

/* ---------- Zād chrome ---------- */
.chrome{position:fixed;left:0;right:0;z-index:35;transition:opacity .18s,transform .18s}
.topbar{
  top:0;padding:calc(9px + env(safe-area-inset-top)) 13px 12px;
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(180deg,color-mix(in srgb,var(--chrome) 99%,transparent),color-mix(in srgb,var(--chrome) 90%,transparent),transparent);
}
.brand{font-family:"Aref Ruqaa",serif;font-size:29px;line-height:1;color:var(--chrome-text)}
.brand-home{text-decoration:none;cursor:pointer}
.top-actions{display:flex;gap:7px}
.iconbtn{
  width:42px;height:42px;border-radius:14px;border:1px solid var(--border);
  background:color-mix(in srgb,var(--chrome-text) 6%,transparent);color:var(--chrome-text);
  display:grid;place-items:center;padding:0
}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.bottom{
  bottom:-1px;
  padding:4px 7px calc(4px + env(safe-area-inset-bottom));
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 94px;
  gap:6px;align-items:center;direction:rtl;
  /* Solid near the bottom, gently translucent toward the Mushaf. */
  background:linear-gradient(
    0deg,
    color-mix(in srgb,var(--chrome) 99%,transparent) 0%,
    color-mix(in srgb,var(--chrome) 96%,transparent) 58%,
    color-mix(in srgb,var(--chrome) 70%,transparent) 82%,
    color-mix(in srgb,var(--chrome) 22%,transparent) 100%
  );
  -webkit-backdrop-filter:blur(5px);
  backdrop-filter:blur(5px);
}
.tool,.navbtn{
  height:40px;min-width:0;border-radius:12px;border:1px solid var(--border);
  background:color-mix(in srgb,var(--chrome-text) 6%,transparent);color:var(--chrome-text)
}
.tool{
  display:flex;align-items:center;justify-content:center;gap:5px;padding:0 7px;font-size:10.25px;
  white-space:nowrap;overflow:hidden
}
.tool svg{width:17px;height:17px;flex:0 0 17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool.primary{background:linear-gradient(145deg,#C59A4A,#9B702D);color:#FFF9EA;border-color:#D7B767}
.navs{display:grid;grid-template-columns:1fr 1fr;gap:5px;direction:ltr}
.navbtn{display:grid;place-items:center;padding:0}
.navbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.navbtn:disabled{opacity:.24}
.hidden-tools .chrome{opacity:0;pointer-events:none}
.hidden-tools .topbar{transform:translateY(-14px)}
.hidden-tools .bottom{transform:translateY(14px)}
.desktop-page-nav{display:none}

/* ---------- Long press toolbar ---------- */
.ayah-menu{
  position:fixed;z-index:80;display:none;direction:rtl;
  background:rgba(5,66,53,.96);color:white;border:1px solid rgba(228,201,128,.28);
  border-radius:15px;padding:5px;box-shadow:0 12px 36px rgba(0,0,0,.30);
  transform:translate(-50%,-116%);
}
.ayah-menu.show{display:flex}
.ayah-menu:after{
  content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);
  border-left:8px solid transparent;border-right:8px solid transparent;border-top:8px solid rgba(5,66,53,.96)
}
.menu-btn{
  width:48px;height:48px;border:0;background:transparent;color:#fff;border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;
}
.menu-btn:active{background:rgba(255,255,255,.12)}
.menu-btn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.menu-btn.play svg{fill:currentColor;stroke:none}
.menu-label{font-size:7px;line-height:1;opacity:.9}

/* ---------- Madinah-style collapsible audio ---------- */
.audio-fab{
  position:fixed;z-index:58;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));
  width:54px;height:54px;border:0;border-radius:50%;
  background:linear-gradient(145deg,#C59A4A,#9B702D);
  color:#FFF9EA;display:none;align-items:center;justify-content:center;
  box-shadow:0 10px 28px rgba(0,0,0,.28),0 0 0 7px color-mix(in srgb,var(--gold) 11%,transparent);
}
body.player-on:not(.player-expanded) .audio-fab{display:flex}
.wave{display:flex;align-items:center;gap:3px;height:24px}
.wave i{display:block;width:3px;border-radius:9px;background:currentColor;height:8px;opacity:.96}
body.audio-playing .wave i:nth-child(1){animation:wave .72s ease-in-out infinite}
body.audio-playing .wave i:nth-child(2){animation:wave .72s .12s ease-in-out infinite}
body.audio-playing .wave i:nth-child(3){animation:wave .72s .24s ease-in-out infinite}
body.audio-playing .wave i:nth-child(4){animation:wave .72s .36s ease-in-out infinite}
@keyframes wave{0%,100%{height:7px}50%{height:22px}}

.audio-panel{
  position:fixed;z-index:59;left:12px;right:12px;bottom:calc(9px + env(safe-area-inset-bottom));
  max-width:650px;margin:auto;display:none;
  background:color-mix(in srgb,var(--chrome) 98%,transparent);color:var(--chrome-text);
  border:1px solid var(--border);border-radius:28px;
  box-shadow:0 18px 50px var(--shadow);padding:22px 15px 14px;
  -webkit-backdrop-filter:blur(13px);backdrop-filter:blur(13px);
}
body.player-on.player-expanded .audio-panel{display:block}
.audio-collapse{
  position:absolute;top:-20px;left:50%;transform:translateX(-50%);
  width:70px;height:35px;padding:0;border:1px solid var(--border);border-bottom:0;
  border-radius:22px 22px 0 0;background:color-mix(in srgb,var(--chrome) 98%,transparent);
  color:var(--chrome-text);display:grid;place-items:center;
  box-shadow:0 -5px 14px color-mix(in srgb,var(--shadow) 55%,transparent);
}
.audio-collapse svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.audio-collapse:active{background:color-mix(in srgb,var(--chrome-text) 9%,var(--chrome))}
.audio-top{
  display:grid;grid-template-columns:42px 42px minmax(0,1fr) 42px 42px;gap:7px;align-items:center
}
.audio-round{
  width:42px;height:42px;border:0;border-radius:50%;
  background:color-mix(in srgb,var(--chrome-text) 8%,transparent);color:var(--chrome-text);
  display:grid;place-items:center;padding:0
}
.audio-round svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.audio-qari{
  height:42px;min-width:0;border:1px solid var(--border);border-radius:999px;
  background:color-mix(in srgb,var(--chrome-text) 5%,transparent);color:var(--chrome-text);
  padding:0 14px;outline:none;text-align:right
}
.audio-now{
  margin:11px 2px 3px;font-size:10px;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.audio-progress-row{display:grid;grid-template-columns:42px minmax(0,1fr) 42px;gap:8px;align-items:center;direction:rtl!important}
.audio-progress-time{font-size:9px;line-height:1;color:var(--ui-muted);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center;direction:ltr;unicode-bidi:isolate}
.audio-progress{position:relative;height:22px;direction:rtl!important;display:flex;align-items:center}
.audio-progress:before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;transform:translateY(-50%);border-radius:99px;background:color-mix(in srgb,var(--chrome-text) 13%,transparent)}
.audio-progress i{position:absolute;right:0;left:auto;top:50%;height:3px;width:0;transform:translateY(-50%);border-radius:99px;background:var(--gold-hi);pointer-events:none}
.audio-progress input[type="range"]{position:absolute;inset:0;width:100%;height:22px;margin:0;appearance:none;-webkit-appearance:none;background:transparent;cursor:pointer;touch-action:none}
.audio-progress input[type="range"]::-webkit-slider-runnable-track{height:22px;background:transparent;border:0}
.audio-progress input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:4.5px;border-radius:50%;background:var(--gold-hi);border:2px solid var(--ui-surface);box-shadow:0 1px 5px rgba(0,0,0,.22)}
.audio-progress input[type="range"]::-moz-range-track{height:22px;background:transparent;border:0}
.audio-progress input[type="range"]::-moz-range-progress{background:transparent}
.audio-progress input[type="range"]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--gold-hi);border:2px solid var(--ui-surface);box-shadow:0 1px 5px rgba(0,0,0,.22)}
.audio-progress input[type="range"]:focus-visible{outline:2px solid color-mix(in srgb,var(--gold) 45%,transparent);outline-offset:3px;border-radius:999px}
.audio-controls{
  margin-top:13px;display:grid;grid-template-columns:52px 1fr 66px 1fr 48px 56px;gap:6px;align-items:center
}
.audio-control{
  height:48px;border:0;border-radius:50%;background:color-mix(in srgb,var(--chrome-text) 7%,transparent);
  color:var(--chrome-text);display:grid;place-items:center;padding:0
}
.audio-control svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.audio-main{
  width:62px;height:62px;justify-self:center;background:var(--gold);color:#fff;font-size:22px
}
.audio-pill{
  height:46px;border:0;border-radius:999px;background:color-mix(in srgb,var(--chrome-text) 6%,transparent);
  color:var(--chrome-text);font-size:10px;padding:0 9px;white-space:nowrap
}
.audio-repeat.active,.audio-continuous.active{box-shadow:0 0 0 1px var(--gold-hi) inset;color:var(--gold-hi);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.audio-continuous{font-size:8.5px;padding-inline:5px}
.audio-timer small{display:block;font-size:7px;margin-top:1px;opacity:.75}
@media(max-width:390px){
  .audio-panel{left:7px;right:7px;padding-inline:11px}
  .audio-top{grid-template-columns:39px 39px minmax(0,1fr) 39px 39px;gap:5px}
  .audio-round{width:39px;height:39px}
  .audio-controls{grid-template-columns:46px 1fr 58px 1fr 44px 52px;gap:4px}
  .audio-control{height:44px}.audio-main{width:58px;height:58px}
}

/* ---------- Sheets ---------- */
.backdrop{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{
  width:min(690px,100%);max-height:79vh;overflow:auto;background:var(--sheet);color:#263B35;
  border:1px solid rgba(197,154,74,.30);border-radius:27px 27px 0 0;
  padding:15px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -20px 55px rgba(0,0,0,.28)
}
.sheethead{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid #E5D6BA}
.sheethead h3{font-family:"Aref Ruqaa",serif;font-size:26px;color:var(--green);margin:0}
.close-sheet{border:0;border-radius:11px;background:#EEE4D3;color:#315C51;padding:8px 11px;font-size:11px}
.ref{font-size:11px;color:#8B7654;margin:11px 0 7px}
.tafsir{font-family:Amiri,serif;font-size:19px;line-height:2.05}
.source{font-size:9px;color:#837B70;border-top:1px solid #EADCC4;padding-top:8px;margin-top:11px}
.source-line{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tafsir-more{border:0;background:transparent;color:var(--green);font:600 8px Alexandria,system-ui,sans-serif;padding:2px 0;text-decoration:underline;text-underline-offset:2px}
.tafsir-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
.tafsir-nav-btn{min-width:92px;height:34px;border:1px solid var(--ui-line);border-radius:999px;background:var(--ui-surface-2);color:var(--ui-text);padding:0 12px;font:500 9px Alexandria,system-ui,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.tafsir-nav-btn:active{background:var(--ui-accent-soft)}
.tafsir-nav-btn:disabled{opacity:.32;cursor:default}
.author-bio{font-family:Amiri,serif;font-size:18px;line-height:2;margin-top:12px}
.author-note{margin-top:13px;padding:10px 12px;border-radius:14px;background:#F3E9D6;color:#695E4C;font-size:11px;line-height:1.8}
.bookmark-sections{display:grid;gap:16px;margin-top:12px}
.bookmark-section{display:grid;gap:8px}
.bookmark-section+.bookmark-section{padding-top:13px;border-top:1px solid #E5D6BA}
.bookmark-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.bookmark-title h4{margin:0;font-family:"Aref Ruqaa",serif;font-size:21px;color:var(--green)}
.bookmark-title small{font-size:8px;color:#9A8B75}
.bookmark-list{display:grid;gap:8px}
.bookmark-row{display:grid;grid-template-columns:minmax(0,1fr) 42px;gap:7px;align-items:stretch}
.bookmark-row.recent{grid-template-columns:minmax(0,1fr)}
.bookmark-main,.bookmark-delete{border:1px solid #E6D5B7;background:#FFFAF1;color:#29493F;border-radius:14px}
.bookmark-main{padding:10px 12px;text-align:right;display:grid;gap:3px}
.bookmark-main b{font-family:"Aref Ruqaa",serif;font-size:20px}.bookmark-main small{font-size:9px;color:#8B7654}
.bookmark-main b.ayah-excerpt{font-family:Amiri,serif;font-size:19px;font-weight:700;line-height:1.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bookmark-delete{display:grid;place-items:center;font-size:20px;color:#9A574E}
.empty-state{padding:12px 10px;text-align:center;color:#8B7654;font-size:11px;border:1px dashed #E5D6BA;border-radius:13px}
.menu-btn.wide{width:78px}
/* ---------- Full-screen Quran-style index ---------- */
.index-list{display:grid;gap:7px;margin-top:10px}
.index-row{border:1px solid #E6D5B7;border-radius:15px;background:#FFFAF1;color:#29493F;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;text-align:right}
.index-row b{font-family:"Aref Ruqaa",serif;font-size:21px}.index-row small{font-size:10px;color:#8B7654}.index-row.disabled{opacity:.45}

.quran-index{
  --index-accent:var(--ui-accent);--index-accent-strong:var(--ui-accent);
  --index-dim:color-mix(in srgb,var(--ui-muted) 64%,transparent);
  --index-separator:color-mix(in srgb,var(--ui-gold) 7%,var(--paper));
  position:fixed;inset:0;z-index:105;background:var(--paper);color:var(--quran);
  display:flex;flex-direction:column;direction:rtl;
}
html[data-theme="dark"] .quran-index{--index-separator:color-mix(in srgb,var(--ui-gold) 8%,var(--paper))}
.quran-index-head{
  flex:0 0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px 9px;min-height:62px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--ui-line);background:color-mix(in srgb,var(--paper) 96%,var(--ui-surface-2));
}
.quran-index-title{font-family:"Aref Ruqaa",serif;font-size:27px;line-height:1;color:var(--chrome-text)}
.quran-index-close{width:38px;height:38px;border:1px solid var(--ui-line);border-radius:12px;background:var(--ui-accent-soft);color:var(--chrome-text);display:grid;place-items:center;padding:0}
.quran-index-close svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round}
.quran-index-tabs{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--ui-line);background:color-mix(in srgb,var(--paper) 97%,var(--ui-surface-2))}
.quran-index-share-hint{
  flex:0 0 auto;min-height:25px;display:grid;place-items:center;padding:4px 12px 5px;
  font-family:"Alexandria",system-ui,sans-serif;font-size:9.5px;font-weight:500;
  color:var(--muted);background:color-mix(in srgb,var(--paper) 98%,var(--ui-surface-2));
  border-bottom:1px solid color-mix(in srgb,var(--ui-line) 70%,transparent);
}
.quran-index-share-pop{
  position:fixed;z-index:135;display:none;transform:translate(-50%,-100%);
  border:1px solid color-mix(in srgb,var(--ui-gold) 42%,var(--ui-line));border-radius:999px;
  padding:8px 15px;background:var(--brand);color:#FFF9EA;
  box-shadow:0 10px 28px rgba(0,0,0,.22);font:600 11px "Alexandria",system-ui,sans-serif;
  white-space:nowrap;touch-action:manipulation;
}
.quran-index-share-pop.show{display:block}
.quran-index-share-pop:active{transform:translate(-50%,-100%) scale(.97)}
html[data-theme="dark"] .quran-index-share-pop{background:var(--gold-hi);color:#17372F;border-color:rgba(255,249,234,.20)}

.quran-index-tab{height:46px;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600;position:relative}
.quran-index-tab.active{color:var(--index-accent-strong)}
.quran-index-tab.active:after{content:"";position:absolute;left:18%;right:18%;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--ui-gold)}
.quran-index-scroll{flex:1 1 auto;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:calc(14px + env(safe-area-inset-bottom));scrollbar-width:none;touch-action:pan-y}
.quran-index-scroll::-webkit-scrollbar{display:none}
.quran-index-row{width:100%;min-height:78px;border:0;background:transparent;color:var(--quran);padding:9px 22px 9px 21px;display:grid;grid-template-columns:44px minmax(0,1fr) 48px;gap:11px;align-items:center;text-align:right}
.quran-index-row:active{background:var(--ui-accent-soft)}
.quran-index-row.current{background:linear-gradient(90deg,transparent,var(--ui-accent-soft),transparent)}
.quran-index-surah-num{font-family:"Aref Ruqaa",serif;font-size:20px;color:var(--muted);text-align:center}
.quran-index-main{min-width:0;display:grid;gap:2px}
.quran-index-name{font-family:"Aref Ruqaa",serif;font-size:22px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quran-index-meta{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quran-index-page{font-family:"Aref Ruqaa",serif;font-size:16px;color:var(--muted);text-align:left;direction:rtl}
.quran-index-row.current .quran-index-name,.quran-index-row.current .quran-index-surah-num{color:var(--index-accent-strong)}
.quran-index-juz-sep{min-height:51px;padding:0 23px 0 22px;background:var(--index-separator);color:var(--muted);display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:11px;align-items:center;border-block:1px solid color-mix(in srgb,var(--ui-gold) 10%,transparent)}
.quran-index-juz-sep b{font-family:"Aref Ruqaa",serif;font-size:19px;font-weight:400;text-align:right;color:color-mix(in srgb,var(--chrome-text) 78%,var(--muted))}
.quran-index-juz-sep span{font-family:"Aref Ruqaa",serif;font-size:16px;text-align:left}
.quran-index-quarter-row{grid-template-columns:52px minmax(0,1fr) 48px;min-height:90px}
.hizb-ring{--portion:0%;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;position:relative;overflow:hidden;background:conic-gradient(from 0deg,color-mix(in srgb,var(--ui-accent) 62%,var(--paper)) 0 var(--portion),color-mix(in srgb,var(--ui-muted) 52%,var(--paper)) var(--portion) 100%);color:var(--ui-text);font-family:"Aref Ruqaa",serif;font-size:14px}
html[data-theme="dark"] .hizb-ring{color:#14201D}
.hizb-ring.start{background:color-mix(in srgb,var(--ui-accent) 72%,var(--paper))}
.hizb-ring.q1{--portion:25%}.hizb-ring.q2{--portion:50%}.hizb-ring.q3{--portion:75%}
.hizb-ring:after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ui-accent) 34%,transparent);pointer-events:none}
.quran-index-quarter-title{font-family:Amiri,serif;font-size:18px;line-height:1.45;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:390px){
  .quran-index-row{padding-inline:14px 15px;grid-template-columns:38px minmax(0,1fr) 42px;gap:8px;min-height:73px}
  .quran-index-quarter-row{grid-template-columns:47px minmax(0,1fr) 42px;min-height:84px}
  .hizb-ring{width:44px;height:44px;font-size:13px}.quran-index-name{font-size:20px}.quran-index-quarter-title{font-size:17px}
  .quran-index-juz-sep{padding-inline:17px;grid-template-columns:minmax(0,1fr) 45px;min-height:48px}
}
/* ---------- Zad visual identity: sheets, bookmarks and controls ---------- */
.sheet{background:var(--ui-surface);color:var(--ui-text);border-color:color-mix(in srgb,var(--ui-gold) 28%,transparent)}
.sheethead{border-bottom-color:var(--ui-line)}
.sheethead h3,.bookmark-title h4{color:var(--ui-accent)}
.close-sheet{background:var(--ui-surface-2);color:var(--ui-text);border:1px solid var(--ui-line)}
.ref,.source,.bookmark-title small,.empty-state{color:var(--ui-muted)}
.source,.bookmark-section+.bookmark-section{border-color:var(--ui-line)}
.tafsir-more{color:var(--ui-accent)}
.author-note{background:var(--ui-surface-2);color:var(--ui-muted)}
.bookmark-main,.bookmark-delete,.field select,.index-row{background:var(--ui-surface);color:var(--ui-text);border-color:var(--ui-line)}
.bookmark-main small,.field label,.index-row small{color:var(--ui-muted)}
.bookmark-delete{color:#B9675E}
.apply{background:linear-gradient(145deg,var(--green),#0B493F);color:#FFF9EA;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 24%,transparent)}
html[data-theme="dark"] .apply{background:linear-gradient(145deg,#164A41,#0A302A);color:#FFF9EA}

.settings{display:grid;gap:10px;margin-top:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.field{display:grid;gap:5px}.field label{font-size:10px;color:#786C59}.field select{height:43px;border:1px solid #DDCDAF;border-radius:12px;background:#FFFAF1;color:#29493F;padding:0 10px}
.apply{height:44px;border:0;border-radius:14px;background:var(--green);color:white}
.toast{
  position:fixed;z-index:110;left:50%;top:calc(14px + env(safe-area-inset-top));
  transform:translate(-50%,-7px);padding:8px 13px;border-radius:999px;
  background:rgba(3,28,24,.96);color:white;border:1px solid rgba(228,201,128,.27);
  font-size:10px;opacity:0;pointer-events:none;transition:.18s;white-space:nowrap
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.notice{
  position:fixed;z-index:65;left:50%;top:50%;transform:translate(-50%,-35%);
  background:#202020;color:white;border-radius:17px;padding:12px 17px;
  font-family:"Aref Ruqaa",serif;font-size:18px;opacity:0;pointer-events:none;transition:.2s;
  box-shadow:0 14px 40px rgba(0,0,0,.3)
}
.notice.show{opacity:1;transform:translate(-50%,-50%)}
@media(max-width:390px){
  .bottom{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 82px;padding-inline:5px}
  .tool{font-size:10px;padding-inline:5px}.navs{gap:3px}
}

/* ---------- Zād identity mapping · authoritative ---------- */
:root{color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
.brand{color:var(--brand);font-weight:700}
.topbar{background:linear-gradient(180deg,color-mix(in srgb,var(--chrome) 99%,transparent),color-mix(in srgb,var(--chrome) 92%,transparent),transparent)}
.bottom{background:linear-gradient(0deg,color-mix(in srgb,var(--chrome) 99%,transparent) 0%,color-mix(in srgb,var(--chrome) 96%,transparent) 58%,color-mix(in srgb,var(--chrome) 72%,transparent) 82%,transparent 100%)}
.iconbtn,.tool,.navbtn{color:var(--brand);border-color:var(--line);background:color-mix(in srgb,var(--paper2,#FFFCF4) 76%,transparent)}
.tool.primary,.zad-identity .tool.primary,.audio-main,.audio-fab{background:linear-gradient(135deg,var(--gold-hi),var(--gold));color:#19332C;border-color:var(--gold);box-shadow:0 15px 32px -18px rgba(132,89,22,.48)}
.audio-panel{background:var(--ui-surface);border-color:color-mix(in srgb,var(--gold) 24%,var(--ui-line));color:var(--ui-text)}
.audio-collapse,.audio-round,.audio-control,.audio-pill,.audio-qari{background:color-mix(in srgb,var(--ui-surface) 88%,var(--ui-surface-2));color:var(--ui-text);border-color:var(--ui-line)}
.audio-progress:before{background:color-mix(in srgb,var(--ui-line) 62%,transparent)}
.audio-progress i{background:var(--gold-hi)}
.audio-repeat.active,.audio-continuous.active{color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px rgba(15,92,80,.24)}
.ayah-menu{background:var(--brand-strong);border-color:rgba(228,201,128,.32)}
.ayah-menu:after{border-top-color:var(--brand-strong)}
.sheet{background:var(--ui-surface);color:var(--ui-text);border-color:rgba(197,154,74,.28)}
.sheethead h3,.bookmark-title h4,.quran-index-title{color:var(--brand)}
.close-sheet,.quran-index-close{background:var(--ui-surface-3);color:var(--brand-strong);border-color:var(--ui-line)}
.apply{background:linear-gradient(135deg,#278573,#145F51);color:#fff;box-shadow:none}
.quran-index{--index-accent:var(--brand);--index-accent-strong:var(--brand);--index-separator:var(--ui-surface-3);background:var(--paper);color:var(--ui-text)}
.quran-index-head,.quran-index-tabs{background:var(--ui-surface);border-color:var(--ui-line)}
.quran-index-tab.active{color:var(--brand)}

.quran-index-row.current,.quran-index-row:active{background:var(--brand-soft)}

.quran-index-juz-sep{background:var(--ui-surface-3);border-block-color:rgba(197,154,74,.22)}
.quran-index-juz-sep b{color:var(--brand-strong)}

.hizb-ring.start{background:var(--brand-soft);color:var(--brand-strong)}
.toast,.notice{background:var(--brand-strong);color:var(--ivory);border-color:rgba(228,201,128,.30)}
html[data-theme="dark"] .brand{color:var(--ivory)}

/* ---------- index · smooth two-pane + collapsible Juz ---------- */
.quran-index-viewport{flex:1 1 auto;min-height:0;overflow:hidden;position:relative;touch-action:pan-y;direction:ltr}
.quran-index-track{
  width:200%;height:100%;display:flex;direction:ltr;will-change:transform;
  transform:translate3d(-50%,0,0);
  transition:transform .26s cubic-bezier(.22,.72,.24,1);
}
.quran-index-track.show-juz{transform:translate3d(0,0,0)}
.quran-index-pane{width:50%;height:100%;min-width:0;direction:rtl;overflow:hidden}
.quran-index-pane>.quran-index-scroll{height:100%;margin:0}
.quran-index-scroll{contain:layout paint;transform:translateZ(0)}
.quran-index-juz-list{padding:7px 0 calc(18px + env(safe-area-inset-bottom))}
.juz-accordion{border-bottom:1px solid var(--ui-line);background:transparent}
.juz-accordion-head{
  width:100%;min-height:58px;border:0;background:transparent;color:var(--ui-text);
  padding:7px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto 25px;
  gap:10px;align-items:center;text-align:right
}
.juz-accordion-head:active{background:var(--brand-soft)}
.juz-accordion-head.current{background:color-mix(in srgb,var(--brand-soft) 60%,transparent)}
.juz-accordion-title{display:grid;gap:1px;min-width:0}
.juz-accordion-title b{font-family:"Aref Ruqaa",serif;font-size:19px;font-weight:400;line-height:1.25;color:var(--brand-strong)}
.juz-accordion-title small{font-size:9.5px;color:var(--ui-muted)}
.juz-accordion-page{font-family:"Aref Ruqaa",serif;font-size:14px;color:var(--ui-muted);white-space:nowrap}
.juz-accordion-chevron{width:21px;height:21px;display:grid;place-items:center;color:var(--ui-muted);transition:transform .22s ease}
.juz-accordion-chevron svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.juz-accordion.open .juz-accordion-chevron{transform:rotate(180deg)}
.juz-accordion-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .24s cubic-bezier(.2,.72,.24,1)}
.juz-accordion.open .juz-accordion-body{grid-template-rows:1fr}
.juz-accordion-body-inner{min-height:0;overflow:hidden;background:color-mix(in srgb,var(--ui-surface) 56%,transparent)}
.juz-accordion .quran-index-quarter-row{min-height:80px;padding-block:8px;border-top:1px solid color-mix(in srgb,var(--ui-line) 72%,transparent)}
.juz-accordion .quran-index-quarter-title{font-size:16.5px;line-height:1.7;padding-block:2px}
.juz-accordion .quran-index-meta{font-size:9.5px}
.juz-accordion .hizb-ring{width:40px;height:40px;font-size:12px}
.juz-accordion .quran-index-quarter-row{grid-template-columns:44px minmax(0,1fr) 42px}
.index-excerpt-placeholder{font-weight:400;color:var(--ui-muted)}
html[data-theme="dark"] .juz-accordion-head:active{background:rgba(228,201,128,.07)}
html[data-theme="dark"] .juz-accordion-head.current{background:rgba(228,201,128,.055)}
html[data-theme="dark"] .juz-accordion-title b{color:var(--ivory)}
@media(max-width:390px){
  .juz-accordion-head{min-height:55px;padding-inline:14px;grid-template-columns:minmax(0,1fr) auto 23px;gap:7px}
  .juz-accordion-title b{font-size:18px}
  .juz-accordion .quran-index-quarter-row{min-height:76px;grid-template-columns:41px minmax(0,1fr) 38px}
  .juz-accordion .hizb-ring{width:38px;height:38px}
  .juz-accordion .quran-index-quarter-title{font-size:16px}
}

   Visual-only refinement. Keep the Zād identity, reduce saturated green blocks,
   and reserve gold for focus/current state. */

  --idx-bg:#061F1D;
  --idx-chrome:#082D29;
  --idx-row:#0A2925;
  --idx-row-open:#0B302B;
  --idx-text:#FFF9EA;
  --idx-muted:rgba(255,249,234,.58);
  --idx-faint:rgba(255,249,234,.38);
  --idx-line:rgba(228,201,128,.105);
  --idx-gold:#C59A4A;
  --idx-gold-hi:#E4C980;
  background:var(--idx-bg);
  color:var(--idx-text);
}
html[data-theme="dark"] .quran-index-head{
  background:linear-gradient(180deg,#0A332E 0%,var(--idx-chrome) 100%);

}

html[data-theme="dark"] .quran-index-quarter-title{color:rgba(255,249,234,.94)}

/* ---------- v36 · desktop experience ----------
   Desktop gets its own interaction geometry while the approved mobile layout stays intact. */
@media (min-width:900px){
  .topbar{
    padding:18px 28px 34px;
  }
  .brand{font-size:33px}
  .top-actions{gap:10px}
  .iconbtn{
    width:46px;height:46px;border-radius:14px;
    transition:transform .16s ease,background .16s ease,border-color .16s ease,box-shadow .16s ease;
  }
  .iconbtn:hover,.tool:hover,.navbtn:hover,.audio-round:hover,.audio-control:hover,.audio-pill:hover{
    transform:translateY(-1px);
    border-color:color-mix(in srgb,var(--gold) 42%,var(--ui-line));
    background:color-mix(in srgb,var(--ui-gold) 8%,var(--ui-surface));
    box-shadow:0 10px 24px -20px rgba(39,45,39,.58);
  }
  html[data-theme="dark"] .iconbtn:hover,
  html[data-theme="dark"] .tool:hover,
  html[data-theme="dark"] .navbtn:hover,
  html[data-theme="dark"] .audio-round:hover,
  html[data-theme="dark"] .audio-control:hover,
  html[data-theme="dark"] .audio-pill:hover{
    background:rgba(228,201,128,.085);
    border-color:rgba(228,201,128,.30)
  }
  .iconbtn:focus-visible,.tool:focus-visible,.navbtn:focus-visible,
  .audio-round:focus-visible,.audio-control:focus-visible,.audio-pill:focus-visible,
  .audio-qari:focus-visible{
    outline:3px solid color-mix(in srgb,var(--gold) 34%,transparent);
    outline-offset:3px;
  }

  /* Compact central command dock. Page navigation moves to the two Mushaf sides. */
  .bottom{
    left:50%;right:auto;bottom:18px;
    width:min(520px,calc(100vw - 300px));
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:8px;padding:8px;
    border:1px solid color-mix(in srgb,var(--gold) 19%,var(--ui-line));
    border-radius:20px;
    transform:translateX(-50%);
    background:color-mix(in srgb,var(--ui-surface) 94%,transparent);
    box-shadow:0 18px 44px -28px rgba(28,31,28,.52);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  }
  .hidden-tools .bottom{transform:translate(-50%,14px)}
  .tool{height:48px;font-size:12px;border-radius:14px;gap:7px}
  .tool svg{width:19px;height:19px;flex-basis:19px}

  .bottom .navs{display:none}
  .desktop-page-nav{
    position:fixed;z-index:37;left:50%;top:50%;
    width:min(1040px,calc(100vw - 48px));
    transform:translate(-50%,-50%);
    display:flex;justify-content:space-between;align-items:center;
    pointer-events:none;direction:ltr;
    transition:opacity .18s ease;
  }
  .desktop-page-btn{
    width:56px;height:82px;flex:0 0 56px;
    border:1px solid var(--ui-line);border-radius:20px;pointer-events:auto;
    display:grid;place-items:center;padding:0;color:var(--brand);
    background:color-mix(in srgb,var(--ui-surface) 84%,transparent);
    box-shadow:0 14px 38px -27px rgba(20,28,24,.64);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    transition:transform .16s ease,background .16s ease,border-color .16s ease,opacity .16s ease;
  }
  .desktop-page-btn svg{
    width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round
  }
  .desktop-page-btn:hover{
    transform:scale(1.035);
    border-color:color-mix(in srgb,var(--gold) 42%,var(--ui-line));
    background:color-mix(in srgb,var(--ui-gold) 8%,var(--ui-surface))
  }
  .desktop-page-btn:focus-visible{
    outline:3px solid color-mix(in srgb,var(--gold) 34%,transparent);outline-offset:4px
  }
  .desktop-page-btn:disabled{opacity:.20;cursor:default}
  html[data-theme="dark"] .desktop-page-btn{
    color:rgba(255,249,234,.84);background:rgba(8,45,41,.72);
    border-color:rgba(228,201,128,.18)
  }
  html[data-theme="dark"] .desktop-page-btn:hover{
    background:rgba(228,201,128,.08);border-color:rgba(228,201,128,.32)
  }
  .hidden-tools .desktop-page-nav{opacity:0;pointer-events:none}
  .hidden-tools .desktop-page-btn{pointer-events:none}

  /* Desktop player: information and reciter on one side, transport controls on the other. */
  .audio-panel{
    left:50%;right:auto;bottom:22px;
    width:min(900px,calc(100vw - 120px));max-width:none;
    transform:translateX(-50%);
    padding:23px 24px 18px;border-radius:24px;
  }
  body.player-on.player-expanded .audio-panel{
    display:grid;
    grid-template-columns:minmax(300px,.92fr) minmax(430px,1.25fr);
    grid-template-rows:auto auto auto;
    column-gap:28px;row-gap:8px;align-items:center;
  }
  .audio-collapse{top:-19px}
  .audio-top{
    grid-column:1;grid-row:1;
    grid-template-columns:46px 46px minmax(0,1fr) 46px 46px;gap:8px;
  }
  .audio-round{width:46px;height:46px}
  .audio-qari{
    height:46px;border-radius:14px;padding-inline:15px;
    font-size:12.5px;font-weight:500;
    cursor:pointer;
  }
  .audio-now{
    grid-column:1;grid-row:2;
    margin:3px 3px 1px;font-size:11.5px;line-height:1.6;
  }
  .audio-progress-row{
    grid-column:1/-1;grid-row:3;margin-top:5px;
  }
  .audio-progress:before,.audio-progress i{height:4px}
  .audio-controls{
    grid-column:2;grid-row:1/3;
    margin:0;display:grid;
    grid-template-columns:72px 58px 74px 58px 58px 78px;
    justify-content:center;gap:10px;
  }
  .audio-control{width:54px;height:54px;justify-self:center}
  .audio-main{width:68px;height:68px;font-size:24px}
  .audio-pill{height:48px;font-size:11px;padding-inline:12px}
  .audio-continuous{font-size:10px}

  /* Desktop dialogs become centered panels rather than phone bottom-sheets. */
  .backdrop{align-items:center;padding:28px}
  .sheet{
    width:min(760px,calc(100vw - 80px));max-height:min(780px,86vh);
    border-radius:26px;padding:20px 22px 22px;
    box-shadow:0 28px 80px -36px rgba(0,0,0,.52)
  }
  .sheethead h3{font-size:29px}
  .field select{min-height:48px;font-size:13px}
  .apply{min-height:50px;font-size:13px}

  /* Mouse affordance for clickable Mushaf metadata. */
  .page-meta-link:hover{
    color:var(--gold);background:color-mix(in srgb,var(--gold) 7%,transparent)
  }
}
@media (min-width:900px) and (max-width:1120px){
  .desktop-page-nav{width:calc(100vw - 30px)}
  .audio-panel{width:min(820px,calc(100vw - 70px))}

  tafsirIndexPromise=(async()=>{
    const response=await fetch(`${TAFSIR_DATASET.localBase}index.json`,{cache:"force-cache"});
    if(!response.ok)throw new Error(`tafsir index ${response.status}`);
    const data=await response.json();
    const files=Array.isArray(data?.surah_files)?data.surah_files:[];
    const ayahs=files.reduce((n,x)=>n+(Number(x?.ayah_count)||0),0);
    if(Number(data?.schema_version)!==TAFSIR_DATASET.schemaVersion||
       data?.source_id!==TAFSIR_DATASET.sourceId||files.length!==TAFSIR_DATASET.surahs||
       ayahs!==TAFSIR_DATASET.ayahs||Number(data?.total_fadl_records)!==TAFSIR_DATASET.fadl){

  })().finally(()=>{tafsirIndexPromise=null});

  const s=Math.max(1,Math.min(114,Number(surah)||1));

/* Position inside the 60 Hizb / 240 Rubʿ structure.
   The local table stores the first ayah and Mushaf page of every quarter.
   For page navigation we resolve the latest quarter whose start page is <= p. */
function hizbPositionForPage(p){
  const page=Math.max(1,Math.min(TOTAL_PAGES,Number(p)||1));
  let lo=0,hi=LOCAL_HIZB_QUARTERS.length-1,best=0;
  while(lo<=hi){
    const mid=(lo+hi)>>1,startPage=Number(LOCAL_HIZB_QUARTERS[mid][2]);
    if(startPage<=page){best=mid;lo=mid+1}else hi=mid-1;
  }
  const [surah,ayah,startPage]=LOCAL_HIZB_QUARTERS[best];
  return {
    index:best,
    rub:best+1,
    hizb:Math.floor(best/4)+1,
    phase:best%4, // 0=start, 1=quarter, 2=half, 3=three-quarters
    surah:Number(surah),
    ayah:Number(ayah),
    startPage:Number(startPage)
  };
}
function pageMilestoneLabel(p){
  const page=Number(p)||1,labels=[];
  const j=JUZ_PAGES.findIndex(([from])=>from===page);
  if(j>=0)labels.push(`الجزء ${ar(j+1)}`);
  const h=hizbPositionForPage(page);
  if(h.startPage===page){
    if(h.phase===0)labels.push(`الحزب ${ar(h.hizb)}`);
    else if(h.phase===2)labels.push(`نصف الحزب ${ar(h.hizb)}`);
  }
  return labels.join(" · ");
}

  const job=fetchPage(p).then(data=>{touchPageData(p,data);prunePageDataCache();return data}).finally(()=>pageDataLoads.delete(p));

}

  if(!data)try{data=await getPageData(p)}catch(_){}
  const sid=data?surahIdFromPageData(data):surahIdFromMetaPage(p);
  return {page:p,juz:juzForPage(p),surah:sid,sname:chapterMap.get(sid)?.name_arabic||data?.surahs?.[0]?.name_arabic||""};
}
async function ensurePage(p){
  p=Number(p);if(!Number.isFinite(p)||p<1||p>TOTAL_PAGES)return null;
  const root=document.querySelector(`.page[data-page="${p}"]`);
  if(root?.dataset.loaded==="1"&&pages.has(p))return touchPageData(p,pages.get(p));
  if(pageLoads.has(p))return pageLoads.get(p);
  const job=(async()=>{
    const data=await getPageData(p);
    await ensureQcfFont(data.font);renderPage(data);return data;
  })().finally(()=>pageLoads.delete(p));
  pageLoads.set(p,job);return job;
}
async function prefetchAround(p){
  const jobs=[p-1,p+1].filter(x=>x>=1&&x<=TOTAL_PAGES).map(x=>ensurePage(x).catch(()=>null));
  await Promise.all(jobs);
}
function trimPageDom(center){
  document.querySelectorAll('.page[data-loaded="1"]').forEach(root=>{
    const p=Number(root.dataset.page);
    if(Math.abs(p-center)>2){root.innerHTML="";delete root.dataset.loaded;}
  });
  prunePageDataCache(center);
}
async function getVersePage(k){
  try{
    const idx=await loadVerseIndex(),p=Number(idx?.[k]?.page);
    return p>=1&&p<=TOTAL_PAGES?p:null;
  }catch(_){return null}
}

function groupLineWords(words){
  const groups=[];let g=null;
  for(const w of words){
    const key=w.verse_key||null;
    if(key && g && g.key===key){g.words.push(w)}
    else {g={key,words:[w]};groups.push(g)}
  }
  return groups;
}

function makeWord(w){
  const s=document.createElement("span");
  s.className="word"+(w.type==="end"?" end":"")+(isAllah(w.text)?" allah":"");
  s.textContent=w.char;
  s.dataset.text=w.text||"";
  return s;
}

function makeVerseSegment(group){
  const seg=document.createElement("span");
  seg.className="verse-segment";
  if(group.key)seg.dataset.key=group.key;
  for(const w of group.words)seg.appendChild(makeWord(w));
  if(group.key)bindSegment(seg);
  return seg;
}

function surahIdForHeader(data,lineIndex){
  for(let i=lineIndex+1;i<(data.lines||[]).length;i++){
    for(const w of (data.lines[i].words||[])){
      if(w.verse_key){const n=Number(String(w.verse_key).split(":")[0]);if(n)return n}
    }
  }
  const fallback=Number(data.lines?.[lineIndex]?.words?.[0]?.sura||data.lines?.[lineIndex]?.words?.[0]?.surah||0);
  return fallback||Number(data.surahs?.[0]?.id||0);
}

function renderPage(data){
  const root=document.querySelector(`.page[data-page="${data.page}"]`);
  const surahId=surahIdFromPageData(data),juz=juzForPage(data.page);
  root.dataset.loaded="1";
  root.innerHTML=`<div class="page-meta"><button class="page-meta-link" type="button" data-index-tab="s" aria-label="فتح فهرس السور">سورة ${escapeHtml(chapterMap.get(surahId)?.name_arabic||data.surahs[0]?.name_arabic||"")}</button><button class="page-meta-link" type="button" data-index-tab="j" aria-label="فتح فهرس الأجزاء">الجزء ${ar(juz)}</button></div>
    <div class="page-stage ${data.page<=2?"special":"full"}"><div class="mushaf" id="mushaf-${data.page}"></div></div>
    <div class="page-no">${ar(data.page)}</div><div class="qcf-mark">QCF4 · 1441هـ</div>`;
  root.querySelectorAll(".page-meta-link").forEach(btn=>btn.addEventListener("click",e=>{
    e.stopPropagation();
    openQuranIndex(btn.dataset.indexTab||"s");
  }));

  const host=root.querySelector(".mushaf");
  for(let lineIndex=0;lineIndex<data.lines.length;lineIndex++){
    const line=data.lines[lineIndex];
    const lineEl=document.createElement("div");
    lineEl.className="line";
    const inner=document.createElement("div");
    inner.className="line-inner";

    const first=line.words[0];
    inner.style.fontFamily=`"${data.font||"QCF4_Hafs_01"}"`;
    if(first?.type==="surah_header"){
      const sid=surahIdForHeader(data,lineIndex);
      inner.classList.add("surah-line");
      inner.style.fontFamily='"QCF4_QBSML"';
      const glyph=SURAH_HEADER_GLYPHS[sid];
      if(surahHeaderReady&&glyph){
        inner.classList.add("banner-ready");
        const metric=document.createElement("span");
        metric.className="surah-metric";metric.textContent=first.char;
        const banner=document.createElement("canvas");
        banner.className="surah-banner";banner.dataset.glyph=glyph;
        inner.append(metric,banner);
      }else{
        inner.textContent=first.char;
      }
      inner.setAttribute("aria-label",`سورة ${chapterMap.get(sid)?.name_arabic||""}`);
      lineEl.appendChild(inner);host.appendChild(lineEl);continue;
    }
    if(first?.type==="bismillah"){
      inner.classList.add("bismillah-line");
      // QCF4 encodes the Bismillah with the dedicated Hafs_01 glyph font.
      // Do not inherit the current page font (e.g. Hafs_47), otherwise the
      // glyph becomes blank on later pages. The source data itself omits the
      // Bismillah before At-Tawbah, so the Mushaf convention is preserved.
      inner.style.fontFamily=`"${first.font||"QCF4_Hafs_01"}"`;
      const originalBasm=document.createElement("span");
      originalBasm.className="bismillah-original";
      originalBasm.textContent=first.char;
      const desktopBasm=document.createElement("span");
      desktopBasm.className="bismillah-desktop";
      /* محرف مثبّت من منطقة الاستعمال الخاص، فيلزمه خطّه صراحةً. لو ورث خط
         الصفحة (Hafs_47 مثلًا) لخرج فارغًا، وهي العلّة التي عولجت أعلاه
         للبسملة الأصلية ولم تُعالَج لهذه. */
      desktopBasm.style.fontFamily='"QCF4_Hafs_01"';
      desktopBasm.textContent="";
      inner.append(originalBasm,desktopBasm);
      lineEl.appendChild(inner);host.appendChild(lineEl);continue;
    }

    for(const group of groupLineWords(line.words)) inner.appendChild(makeVerseSegment(group));
    lineEl.appendChild(inner);host.appendChild(lineEl);
  }

  if(selectedKey)root.querySelectorAll(`.verse-segment[data-key="${selectedKey}"]`).forEach(x=>x.classList.add("selected"));
  requestAnimationFrame(()=>fitPage(data.page));
}

function renderSurahHeaderCanvas(canvas,glyph){
  if(!canvas||!glyph)return;
  const sample=260;
  const probe=document.createElement("canvas").getContext("2d");
  probe.font=`${sample}px "QUL_SurahHeader"`;
  probe.textAlign="left";probe.textBaseline="alphabetic";
  const m=probe.measureText(glyph);
  const left=Number.isFinite(m.actualBoundingBoxLeft)?m.actualBoundingBoxLeft:0;
  const right=Number.isFinite(m.actualBoundingBoxRight)?m.actualBoundingBoxRight:m.width;
  const asc=Number.isFinite(m.actualBoundingBoxAscent)?m.actualBoundingBoxAscent:sample*.72;
  const desc=Number.isFinite(m.actualBoundingBoxDescent)?m.actualBoundingBoxDescent:sample*.18;
  const inkW=Math.max(1,left+right),inkH=Math.max(1,asc+desc);
  const pad=Math.max(5,Math.round(sample*.025));
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const cssW=inkW+pad*2,cssH=inkH+pad*2;
  canvas.width=Math.ceil(cssW*dpr);canvas.height=Math.ceil(cssH*dpr);
  canvas.style.aspectRatio=`${cssW}/${cssH}`;
  const ctx=canvas.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.font=`${sample}px "QUL_SurahHeader"`;
  ctx.textAlign="left";ctx.textBaseline="alphabetic";
  // Draw the ready-made color glyph first, then tint only its visible pixels
  // to a calm theme-aware tone. This keeps the professional artwork while
  // avoiding the bright turquoise look in dark mode.
  ctx.fillText(glyph,pad+left,pad+asc);
  ctx.globalCompositeOperation="source-in";
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--surah-banner").trim()||"#55766D";
  ctx.fillRect(0,0,cssW,cssH);
  ctx.globalCompositeOperation="source-over";
}

/* نسبةُ الإطار الزخرفي للسورة، تُقاس من الخط لا من الرسم، فتُعرف قبل الملاءمة.
   الرسم نفسه يقع بعد تحديد المقياس، ولا يصلح مصدرًا لقرارٍ يسبقه. */
const surahAspectCache=new Map();
function surahGlyphAspect(glyph){
  if(surahAspectCache.has(glyph))return surahAspectCache.get(glyph);
  const sample=260;
  const probe=document.createElement("canvas").getContext("2d");
  probe.font=`${sample}px "QUL_SurahHeader"`;
  probe.textAlign="left";probe.textBaseline="alphabetic";
  const m=probe.measureText(glyph);
  const left=Number.isFinite(m.actualBoundingBoxLeft)?m.actualBoundingBoxLeft:0;
  const right=Number.isFinite(m.actualBoundingBoxRight)?m.actualBoundingBoxRight:m.width;
  const asc=Number.isFinite(m.actualBoundingBoxAscent)?m.actualBoundingBoxAscent:sample*.72;
  const desc=Number.isFinite(m.actualBoundingBoxDescent)?m.actualBoundingBoxDescent:sample*.18;
  const pad=Math.max(5,Math.round(sample*.025));
  const w=Math.max(1,left+right)+pad*2,h=Math.max(1,asc+desc)+pad*2;
  const aspect=w/h;
  /* لا يُخزَّن قياسٌ أُخذ قبل وصول الخط، وإلا ثبت الخطأ إلى آخر الجلسة.
     ويُسأل عن المحرف نفسه: الفحص بلا نصّ يجرّب محارف لاتينية لا وجود لها
     في خطّ العناوين، فيأتي الجواب بالنفي ولو كان الخط حاضرًا. */
  let ready=surahHeaderReady;
  try{if(ready&&document.fonts)ready=document.fonts.check(`${sample}px "QUL_SurahHeader"`,glyph)}catch(e){}
  if(ready&&aspect>0)surahAspectCache.set(glyph,aspect);
  return aspect;
}

/* حبر QCF4 يتجاوز صندوق سطره صعودًا ونزولًا: الشدّة والمدّة تعلوان الصندوق،
   وأرقام الآيات وعلامات الوقف تنزل تحته. وقياس الصناديق لا يرى هذا الحبر،
   فتُحجز له حاشيةٌ في طرفَي الصفحة، مقدارها جزء من ارتفاع السطر الواحد.
   ولمّا كانت الحاشية تُضاف إلى قيد الارتفاع وحده، فهي لا تمسّ صفحةً يحكمها
   العرض — وهي عامّة الصفحات. أثرها محصور في الصفحات المزدحمة بالعناوين. */
const INK_GUARD=.45;

/* أدنى حجم يُقبل به للسطر القرآني، بالبكسل المنطقي، قبل أن تُفتح الصفحة
   للتمرير. اجعله 0 لتعطيل الأرضية والعودة إلى الملاءمة الهندسية المحضة،
   وارفعه إن آثرتَ خطًّا أكبر مع تمرير على صفحةٍ كاملة بخطٍّ أصغر. */
const MIN_LINE_PX=24;

/* الصفحة لا تُكسر من أجل الأرضية إلا إذا كان المكسب معتبرًا. كسرُها لتربح
   جزءًا من بكسل صفقةٌ خاسرة: تخسر الصفحةَ كاملةً وتكسب ما لا يكاد يُرى. */
const FLOOR_TOLERANCE=.90;

function fitPage(p){
  const root=document.querySelector(`.page[data-page="${p}"]`);
  if(!root)return;
  const stage=root.querySelector(".page-stage"),host=root.querySelector(".mushaf");
  const normal=[...host.querySelectorAll(".line-inner:not(.surah-line):not(.bismillah-line)")];
  if(!normal.length)return;

  // Preserve the stable QCF4 composition first. Surah banners are overlays and
  // are deliberately excluded from the Quran text fit; they can never shrink ayat.
  const base=p<=2?112:104;
  const surahBase=p<=2?116:108;
  const basBase=p<=2?102:96;

  normal.forEach(x=>x.style.fontSize=base+"px");
  const surahs=[...host.querySelectorAll(".surah-line")];
  const bases=[...host.querySelectorAll(".bismillah-line")];
  surahs.forEach(x=>x.style.fontSize=surahBase+"px");
  bases.forEach(x=>x.style.fontSize=basBase+"px");

  requestAnimationFrame(()=>{
    // Always measure from a neutral layout: no scrollbar stealing width, no
    // gap calculated by a previous fit, and no reserved banner height left
    // over from one. Otherwise an earlier result pollutes rawH and the Quran
    // text shrinks a little after repeated resizes.
    stage.classList.remove("scrolls");
    host.style.justifyContent="center";
    host.style.gap="0px";
    surahs.forEach(x=>x.style.minHeight="");

    const targetW=Math.min(stage.clientWidth*.985,775);
    const targetH=stage.clientHeight*.955;
    const maxW=Math.max(...normal.map(x=>x.getBoundingClientRect().width),1);

    // Measure the actual Quran rows, not mushaf.scrollHeight. The Mushaf host is
    // deliberately height:100%, so scrollHeight mostly mirrors the viewport and
    // cannot detect when a window is wide but too short.
    const rows=[...host.children];
    const rawH=Math.max(rows.reduce((sum,row)=>{
      const inner=row.querySelector(".line-inner");
      if(!inner)return sum;
      const box=inner.getBoundingClientRect(),cs=getComputedStyle(inner);
      return sum+box.height+(parseFloat(cs.marginTop)||0)+(parseFloat(cs.marginBottom)||0);
    },0),1);

    // عنوان السورة طبقة عائمة فوق سطره، فارتفاعه الحقيقي لا يدخل في صندوق
    // ذلك السطر ولا في rawH. وهو أطول من الصندوق، لأن نسبة الإطار الجاهز
    // ليست نسبة صندوق QCF4. فإن تُرك بلا حساب وقع أمران معًا: غطّى العنوانُ
    // السطر الذي قبله، وجاءت الصفحة أطول ممّا قيس فطلبت تمريرًا لا موجب له.
    // ولمّا كان عرض الإطار متناسبًا مع المقياس، كان فائضه متناسبًا معه أيضًا،
    // فيُحسب مرة واحدة عند المقياس ١ ويُضاف إلى الارتفاع قبل حلّ المعادلة.
    const banners=[];
    let bannerExtra=0;
    surahs.forEach(line=>{
      const banner=line.querySelector("canvas.surah-banner");
      if(!banner)return;
      const aspect=surahGlyphAspect(banner.dataset.glyph);
      if(!(aspect>0))return;
      const widthAtBase=maxW*.965;
      banners.push({line,banner,aspect});
      bannerExtra+=Math.max(0,widthAtBase/aspect-line.getBoundingClientRect().height);
    });
    const pageH=rawH+bannerExtra+INK_GUARD*(normal[0].getBoundingClientRect().height||base*1.33);

    // قيد العرض لا يُخرق أبدًا: تجاوزه يقصّ السطر القرآني، وهو ما لا يُحتمل.
    // وقيد الارتفاع يُخرق عند الضرورة وحدها، فيتحوّل الأمر إلى تمرير رأسي بدل
    // خطٍّ لا يُقرأ. ولذلك تُقيَّد الأرضية بقيد العرض نفسه، ولا يُعمل بها إلا
    // حين ينزل المقاس عنها نزولًا معتبرًا.
    const wScale=Math.min(1,targetW/maxW);
    const hScale=targetH/pageH;
    const floorScale=Math.min(MIN_LINE_PX/base,wScale);
    const scale=hScale<floorScale*FLOOR_TOLERANCE?floorScale:Math.min(wScale,hScale);
    const overflows=scale>hScale+1e-4;

    // Exactly the same page scale is applied to Quran lines, QCF title metrics,
    // and basmala. The decorative banner itself is fitted only afterwards.
    normal.forEach(x=>x.style.fontSize=(base*scale)+"px");
    surahs.forEach(x=>x.style.fontSize=(surahBase*scale)+"px");
    bases.forEach(x=>x.style.fontSize=(basBase*scale)+"px");

    // كل عنوان يحجز ارتفاعه على سطره، فلا يبقى تراكبٌ ممكنًا بحال.
    banners.forEach(({line,banner,aspect})=>{
      const w=Math.min(maxW*scale*.965,host.clientWidth*.96);
      banner.style.width=w+"px";
      line.style.minHeight=(w/aspect)+"px";
    });

    // مركزةُ محتوًى فائضٍ تجعل أعلاه غير قابل للوصول، فيبدأ من الأعلى حينئذٍ.
    // وعند الخروج من التمرير الطارئ يُصفَّر الموضع صراحةً: المسرح يعود إلى
    // overflow:hidden وهو لا يزال حاوية تمرير برمجيًّا، فقد يبقى فيه إزاحةٌ
    // لا سبيل للقارئ إلى ردّها. ولا يُمسّ الموضع ما دامت الصفحة في التمرير،
    // فلا يُقذف القارئ إلى أوّلها كلّما غُيّر حجم النافذة.
    stage.classList.toggle("scrolls",overflows);
    if(!overflows)stage.scrollTop=0;
    host.style.justifyContent=overflows?"flex-start":"center";

    requestAnimationFrame(()=>{
      // Render the *visible ink* of the ready-made QUL glyph, then crop the
      // canvas to that ink. This avoids the large internal font metrics that
      // can make the decorative header look tiny. Its CSS width is
      // independent of the QCF4 line box and therefore never shrinks ayat.
      banners.forEach(({banner})=>renderSurahHeaderCanvas(banner,banner.dataset.glyph));

      if(p>=3&&!overflows&&rows.length>1){
        const rowHeight=rows.reduce((sum,row)=>sum+row.getBoundingClientRect().height,0);
        const usable=stage.clientHeight*.955;
        const spare=Math.max(0,usable-rowHeight);
        const gap=Math.max(0,Math.min(18,spare/(rows.length-1)));
        host.style.gap=gap.toFixed(2)+"px";
      }
    });
  });
}

function clearVerseSelection(){
  document.querySelectorAll(".verse-segment.selected").forEach(x=>x.classList.remove("selected"));
  selectedKey=null;selectedAnchor=null;closeMenu();
}
function selectVerse(k,anchor,force=false){
  if(!force && selectedKey===k){
    clearVerseSelection();
    hideTools();
    return false;
  }
  selectedKey=k;selectedAnchor=anchor||selectedAnchor;
  document.querySelectorAll(".verse-segment.selected").forEach(x=>x.classList.remove("selected"));
  document.querySelectorAll(`.verse-segment[data-key="${k}"]`).forEach(x=>x.classList.add("selected"));
  const v=verseParts(k);showToast(`سورة ${v.sname} · الآية ${ar(v.a)}`);
  return true;
}

function bindSegment(seg){
  let sx=0,sy=0,moved=false;
  seg.addEventListener("pointerdown",e=>{
    sx=e.clientX;sy=e.clientY;moved=false;longTriggered=false;
    clearTimeout(longTimer);
    longTimer=setTimeout(()=>{
      if(moved)return;
      longTriggered=true;clearTimeout(toolsTimer);selectVerse(seg.dataset.key,seg,true);openPrimaryMenu(seg);
    },520);
  });
  seg.addEventListener("pointermove",e=>{
    if(Math.hypot(e.clientX-sx,e.clientY-sy)>10){moved=true;clearTimeout(longTimer)}
  });
  seg.addEventListener("pointerup",e=>{
    clearTimeout(longTimer);
    if(!moved&&!longTriggered){const on=selectVerse(seg.dataset.key,seg,false);if(on)showToolsFor(2800)}
  });
  seg.addEventListener("pointercancel",()=>clearTimeout(longTimer));
}

/* ---------- paging: exactly one page per gesture ---------- */
function loadList(key){
  const x=storageJsonGet(key,[]);return Array.isArray(x)?x:[];
}
function saveList(key,list){return storageJsonSet(key,list)}
function archivePreviousVisit(item){
  if(!item||!Number.isFinite(+item.page))return;
  const key=STORAGE_KEYS.recentVisits,list=loadList(key);
  list.unshift({page:+item.page,savedAt:+item.savedAt||Date.now()});
  saveList(key,list.slice(0,3));
}
function saveLastPosition(){
  storageJsonSet(STORAGE_KEYS.lastPosition,{page:currentPage,savedAt:Date.now()});
}
function updatePage(animate=true,savePosition=true){
  track.style.transition=animate?"transform .31s cubic-bezier(.2,.78,.2,1)":"none";
  track.style.transform=`translateX(${-(TOTAL_PAGES-currentPage)*100}vw)`;
  document.getElementById("prevBtn").disabled=currentPage===1;
  document.getElementById("nextBtn").disabled=currentPage===TOTAL_PAGES;
  document.getElementById("desktopPrevBtn").disabled=currentPage===1;
  document.getElementById("desktopNextBtn").disabled=currentPage===TOTAL_PAGES;
  closeMenu();
  if(savePosition)saveLastPosition();
  const milestone=pageMilestoneLabel(currentPage);
  if(milestone)showNotice(milestone);
}
async function go(p){
  const target=Math.max(1,Math.min(TOTAL_PAGES,Number(p)||1));
  if(navigationBusy||target===currentPage)return;
  navigationBusy=true;
  try{
    await ensurePage(target);
    clearVerseSelection();
    currentPage=target;updatePage(true);
    /* لا يعود التمرير معلّقًا على نوع المؤشّر: أي صفحة قد تصير قابلة للتمرير،
       فتُفتح من أعلاها دائمًا. وهو بلا أثر على الصفحات التي تكتمل. */
    requestAnimationFrame(()=>{
      const s=document.querySelector(`.page[data-page="${target}"] .page-stage`);
      if(s)s.scrollTop=0;
    });
    prefetchAround(target).then(()=>trimPageDom(target));
  }catch(e){console.error("QCF page load failed",target,e);showToast("تعذّر تحميل الصفحة "+ar(target))}
  finally{navigationBusy=false}
}
track.addEventListener("pointerdown",e=>{
  downX=e.clientX;downY=e.clientY;swipeActive=true;
});
track.addEventListener("pointerup",e=>{
  if(!swipeActive)return;swipeActive=false;
  const dx=e.clientX-downX,dy=e.clientY-downY;
  if(Math.abs(dx)<55||Math.abs(dx)<Math.abs(dy)*1.15)return;
  // Arabic book: swipe RIGHT => next page enters from LEFT.
  if(dx>0)go(currentPage+1); else go(currentPage-1);
});
track.addEventListener("pointercancel",()=>swipeActive=false);
document.getElementById("prevBtn").onclick=()=>go(currentPage-1);
document.getElementById("nextBtn").onclick=()=>go(currentPage+1);
document.getElementById("desktopPrevBtn").onclick=()=>go(currentPage-1);
document.getElementById("desktopNextBtn").onclick=()=>go(currentPage+1);

/* ---------- floating ayah menu ---------- */
function placeMenu(anchor){
  const r=anchor.getBoundingClientRect();
  const x=Math.max(128,Math.min(innerWidth-128,r.left+r.width/2));
  const y=Math.max(100,r.top);

/* ---------- Quran text from page JSON ---------- */
function verseTextCached(k){
  const out=[];
  for(const data of pages.values())for(const line of data.lines||[])for(const w of line.words||[])
    if(w.verse_key===k&&w.type==="word"&&w.text)out.push(w.text);
  return out.join(" ");
}
function collectVerseWords(data,k,out){
  let found=false;
  for(const line of data?.lines||[])for(const w of line.words||[]){
    if(w.verse_key===k&&w.type==="word"&&w.text){out.push(w.text);found=true}
  }
  return found;
}
async function verseTextFull(k,pageHint=null){
  const out=[];
  const hinted=Number(pageHint);
  let start=null;
  if(hinted>=1&&hinted<=TOTAL_PAGES)start=Math.max(1,hinted-1);
  else{
    const indexedStart=await getVersePage(k).catch(()=>null);
    start=indexedStart||Math.max(1,currentPage-1);
  }
  // A verse can cross a Mushaf page boundary. With a page hint we also inspect
  // the previous page so copying/bookmarks still work if the selected segment
  // is a continuation and the global verse index is unavailable offline.
  let seen=false;
  for(let p=start;p<=Math.min(TOTAL_PAGES,start+3);p++){
    try{
      const data=await getPageData(p),found=collectVerseWords(data,k,out);
      if(seen&&!found)break;
      seen=seen||found;
    }catch(_){break}
  }
  return out.length?out.join(" "):verseTextCached(k);
}
function publicSurahUrl(s,ayah=null){
  const n=Number(s),u=new URL(`surah/${n}/`,new URL("./",location.href));
  const a=Number(ayah);
  if(Number.isInteger(a)&&a>=1)u.searchParams.set("ayah",String(a));
  return u.href;
}
function publicJuzUrl(j){
  const n=Number(j);
  return new URL(`juz/${n}/`,new URL("./",location.href)).href;
}
function linkFor(k){
  const [s,a]=String(k||"").split(":").map(Number);
  return publicSurahUrl(s,a);
}
function ayahFromHash(){
  const m=location.hash.match(/^#ayah=(\d{1,3}):(\d{1,3})$/);
  if(!m)return null;
  const s=Number(m[1]),a=Number(m[2]),max=Number(chapterMap.get(s)?.verses_count||0);
  return s>=1&&s<=114&&a>=1&&a<=max?`${s}:${a}`:null;
}
function readerEntryParams(){
  const q=new URLSearchParams(location.search);
  const rawCode=String(q.get("code")||"").trim().toUpperCase();
  const code=rawCode.slice(0,4);
  const juz=Number(q.get("juz")),page=Number(q.get("page"));
  const surah=Number(q.get("surah")),ayah=Number(q.get("ayah"));
  return {
    code,
    juz:Number.isInteger(juz)&&juz>=1&&juz<=30?juz:null,
    page:Number.isInteger(page)&&page>=1&&page<=TOTAL_PAGES?page:null,
    surah:Number.isInteger(surah)&&surah>=1&&surah<=114?surah:null,
    ayah:Number.isInteger(ayah)&&ayah>=1?ayah:null
  };
}
function zadReturnUrl(){
  const {code}=readerEntryParams();
  return code?`./#${encodeURIComponent(code)}`:"./";
}
async function copyText(t,msg="تم النسخ"){
  try{
    if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(t);
    else{
      const box=document.createElement("textarea");box.value=t;box.setAttribute("readonly","");box.style.cssText="position:fixed;opacity:0;pointer-events:none";
      document.body.appendChild(box);box.select();const ok=document.execCommand("copy");box.remove();if(!ok)throw new Error("copy unavailable");
    }
    showToast(msg);
  }catch(_){showToast("تعذّر النسخ من هذا المتصفح")}
}
async function doShare(kind){
  if(!selectedKey)return;
  const v=verseParts(selectedKey),text=await verseTextFull(selectedKey,currentPage),url=linkFor(selectedKey);
  try{
    if(kind==="copy"){await copyText(text);closeMenu();return}
    if(navigator.share){
      if(kind==="app")await navigator.share({title:`سورة ${v.sname} · الآية ${v.a}`,text:`${text}\n— سورة ${v.sname}، الآية ${v.a}`,url});
      else await navigator.share({title:`سورة ${v.sname} · الآية ${v.a}`,url});
    }else await copyText(kind==="app"?`${text}\n${url}`:url,"تم نسخ المحتوى للمشاركة");
  }catch(e){if(e?.name!=="AbortError")showToast("تعذّرت المشاركة الآن")}

function firstFourWords(text){

async function bookmarkAyahExcerpt(item){
  if(item?.excerpt)return String(item.excerpt);

    return firstFourWords(await verseTextFull(item?.verse,p));

async function verseExcerptForIndex(k,p){

function ayahAudioSourceId(s,r=reciter){
  if(r.provider==="ayah"&&r.everyAyahId)return r.everyAyahId;
  if(r.id==="Husary_128kbps"&&Number(s)===1&&r.fatihaEveryAyahId)return r.fatihaEveryAyahId;
  return "";
}
function audioUrl(s,a){
  const sourceId=ayahAudioSourceId(s);
  if(!sourceId)throw new Error("ayah provider unavailable");
  return `https://everyayah.com/data/${sourceId}/${pad3(s)}${pad3(a)}.mp3`;
}
function maxAyah(s){return Number(chapterMap.get(Number(s))?.verses_count)||({1:7,2:286}[Number(s)]||286)}
function compactArabic(s){return normalizeArabic(s).replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/\s+/g,"")}
async function loadTimedReads(){
  if(!mp3ReadsPromise){
    mp3ReadsPromise=fetch("https://mp3quran.net/api/v3/ayat_timing/reads",{cache:"force-cache"})
      .then(r=>{if(!r.ok)throw new Error("mp3quran reads");return r.json()})
      .then(rows=>Array.isArray(rows)?rows:[])
      .catch(err=>{mp3ReadsPromise=null;throw err});
  }
  return mp3ReadsPromise;
}
function normalizedAudioText(value){
  return compactArabic(String(value||""))
    .replace(/ة/g,"ه")
    .replace(/ؤ/g,"و")
    .replace(/ئ/g,"ي");
}
function timedReadScore(row,r){
  const n=normalizedAudioText(row?.name),rw=normalizedAudioText(row?.rewaya);
  const names=(r.timedNames||[]).map(normalizedAudioText);
  if(!names.some(x=>x&&(n.includes(x)||x.includes(n))))return -Infinity;

  const rejects=(r.timedReject||[]).map(normalizedAudioText).filter(Boolean);
  if(rejects.some(x=>rw.includes(x)))return -Infinity;

  const required=(r.timedRequireAny||[]).map(normalizedAudioText).filter(Boolean);
  if(required.length&&!required.some(x=>rw.includes(x)))return -Infinity;

  let score=100;
  for(const x of (r.timedPrefer||[]).map(normalizedAudioText).filter(Boolean)){
    if(rw.includes(x))score+=10;
  }
  // Prefer complete 114-surah mappings whenever the API exposes count.
  const count=Number(row?.soar_count)||0;
  if(count===114)score+=8;
  else if(count>0)score+=Math.min(5,count/30);
  return score;
}
async function resolveMp3Read(){
  if(timedReadCache.has(reciter.id))return timedReadCache.get(reciter.id);
  const rows=await loadTimedReads();
  let best=null,bestScore=-Infinity;
  for(const row of rows){
    const score=timedReadScore(row,reciter);
    if(score>bestScore){best=row;bestScore=score}
  }
  const resolved=Number.isFinite(bestScore)&&bestScore>-Infinity?best:null;
  timedReadCache.set(reciter.id,resolved);
  return resolved;
}
async function getMp3Timing(s){
  const read=await resolveMp3Read();
  if(!read)throw new Error("timed reciter unavailable");
  const key=`${read.id}:${s}`;
  if(mp3TimingCache.has(key))return {read,rows:mp3TimingCache.get(key)};
  const r=await fetch(`https://mp3quran.net/api/v3/ayat_timing?surah=${s}&read=${read.id}`,{cache:"force-cache"});
  if(!r.ok)throw new Error("mp3quran timing");
  const rows=await r.json();
  if(!Array.isArray(rows)||!rows.some(x=>Number(x.ayah)>0))throw new Error("invalid mp3quran timing");
  mp3TimingCache.set(key,rows);
  return {read,rows};
}
function normalizeTimedRows(raw){
  return (Array.isArray(raw)?raw:[]).map(x=>{
    const verseKey=String(x?.verse_key||x?.verseKey||"");
    const ayah=Number(verseKey.split(":")[1]||x?.ayah||x?.verse_number||x?.verseNumber);
    const start=Number(x?.timestamp_from??x?.timestampFrom??x?.start_time);
    const end=Number(x?.timestamp_to??x?.timestampTo??x?.end_time);
    return {ayah,start_time:start,end_time:end};
  }).filter(x=>x.ayah>0&&Number.isFinite(x.start_time)&&Number.isFinite(x.end_time));
}
async function getMaherQulTiming(s){
  if(maherQulTimingCache.has(s))return maherQulTimingCache.get(s);

  // This is the already-extracted QUL /562 timestamp file used by an
  // existing open-source Quran implementation. We intentionally consume
  // the exported data as-is; no local alignment or offset correction.
  const MAHER_TIMING_REV="2c71289821ff17158dfead0eb0404263c2bd0879";
  const url=`https://cdn.jsdelivr.net/gh/facilitator999/quranforyunus@${MAHER_TIMING_REV}/audio/maher/timestamps/${s}.json`;
  const r=await fetch(url,{cache:"force-cache"});
  if(!r.ok)throw new Error(`Maher QUL timing ${r.status}`);
  const data=await r.json();
  const af=data?.audio_file||data?.audioFile||data;
  const rows=normalizeTimedRows(af?.timestamps||data?.timestamps);
  if(!rows.length)throw new Error("invalid Maher QUL timing");

  const src=`https://audio-cdn.tarteel.ai/quran/surah/maherAlMuaiqly/murattal/mp3/${pad3(s)}.mp3`;
  const out={src,rows};
  maherQulTimingCache.set(s,out);
  return out;
}
function isTimedProvider(r=reciter){
  return r.provider==="mp3quran-timed"||r.provider==="qul-maher";
}
async function resolveGaplessForCurrentSurah(){
  if(!isTimedProvider())return null;

  let src="",rows=[];
  if(reciter.provider==="mp3quran-timed"){
    const timed=await getMp3Timing(play.surah);
    src=(timed.read.folder_url.endsWith("/")?timed.read.folder_url:timed.read.folder_url+"/")+pad3(play.surah)+".mp3";
    rows=normalizeTimedRows(timed.rows);
  }else if(reciter.provider==="qul-maher"){
    const timed=await getMaherQulTiming(play.surah);
    src=timed.src;rows=timed.rows;
  }

  const t=rows.find(x=>Number(x.ayah)===Number(play.current));
  if(!src||!t)throw new Error("timed ayah missing");
  return {src,rows,t};
}
function mediaReady(){
  if(audio.readyState>=1)return Promise.resolve();
  return new Promise((resolve,reject)=>{
    const timer=setTimeout(()=>bad(),15000);
    const ok=()=>{cleanup();resolve()},bad=()=>{cleanup();reject(new Error("audio metadata"))};
    const cleanup=()=>{clearTimeout(timer);audio.removeEventListener("loadedmetadata",ok);audio.removeEventListener("error",bad)};
    audio.addEventListener("loadedmetadata",ok,{once:true});audio.addEventListener("error",bad,{once:true});
  });
}

let progressSeeking=false;
function formatAudioTime(seconds){
  const total=Math.max(0,Math.floor(Number(seconds)||0));
  const h=Math.floor(total/3600),m=Math.floor((total%3600)/60),sec=total%60;
  const raw=h?`${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`:`${m}:${String(sec).padStart(2,"0")}`;
  return ar(raw);
}
function timedSurahProgressMode(){
  return continuousMode&&audio.dataset.playMode==="gapless"&&Array.isArray(activeTimingRows)&&activeTimingRows.length>0&&Number.isFinite(audio.duration)&&audio.duration>0;
}
function audioProgressScope(){
  if(timedSurahProgressMode())return {start:0,end:audio.duration,current:audio.currentTime||0,surah:true};
  if(activeSegment)return {start:activeSegment.start,end:activeSegment.end,current:audio.currentTime||activeSegment.start,surah:false};
  if(Number.isFinite(audio.duration)&&audio.duration>0)return {start:0,end:audio.duration,current:audio.currentTime||0,surah:false};
  return {start:0,end:0,current:0,surah:false};
}
function paintAudioProgress(value=null){
  const scope=audioProgressScope(),span=Math.max(0,scope.end-scope.start);
  const p=value===null?(span?Math.max(0,Math.min(1,(scope.current-scope.start)/span)):0):Math.max(0,Math.min(1,Number(value)||0));
  const fill=document.getElementById("progressFill"),seek=document.getElementById("progressSeek");
  if(fill)fill.style.width=(p*100)+"%";
  if(seek&&!progressSeeking)seek.value=String(Math.round(p*1000));
  const current=document.getElementById("audioTimeCurrent"),total=document.getElementById("audioTimeTotal");
  if(current)current.textContent=formatAudioTime(span*p);
  if(total)total.textContent=formatAudioTime(span);
}
function resetAudioProgress(){
  progressSeeking=false;
  const seek=document.getElementById("progressSeek");if(seek)seek.value="0";
  const fill=document.getElementById("progressFill");if(fill)fill.style.width="0%";
  const current=document.getElementById("audioTimeCurrent"),total=document.getElementById("audioTimeTotal");
  if(current)current.textContent="٠:٠٠";if(total)total.textContent="٠:٠٠";
}
function completeAudioProgress(){
  progressSeeking=false;
  const scope=audioProgressScope(),span=Math.max(0,scope.end-scope.start);
  const seek=document.getElementById("progressSeek");if(seek)seek.value="1000";
  const fill=document.getElementById("progressFill");if(fill)fill.style.width="100%";
  const current=document.getElementById("audioTimeCurrent"),total=document.getElementById("audioTimeTotal");
  if(current)current.textContent=formatAudioTime(span);if(total)total.textContent=formatAudioTime(span);
}
function timingRowAt(seconds){
  if(!Array.isArray(activeTimingRows)||!activeTimingRows.length)return null;
  const t=Number(seconds)||0;
  let chosen=activeTimingRows[0];
  for(const row of activeTimingRows){
    const start=Number(row.start_time)/1000,end=Number(row.end_time)/1000;
    if(t>=start)chosen=row;
    if(t>=start&&t<end)return row;
    if(t<start)break;
  }
  return chosen;
}
function seekAudioProgress(value){
  const scope=audioProgressScope(),span=Math.max(0,scope.end-scope.start);
  if(!(span>0))return;
  const p=Math.max(0,Math.min(1,Number(value)/1000)),target=scope.start+span*p;
  if(scope.surah){
    const row=timingRowAt(target);
    if(row){
      const a=Number(row.ayah);
      activeSegment={start:Number(row.start_time)/1000,end:Number(row.end_time)/1000};
      if(a&&a!==play.current){
        play.current=a;play.repeatAyahLeft=play.repeatAyah;
        updatePlayer();
        const requestId=++playbackRequestId;
        syncPlaybackSelectionInBackground(requestId);
      }
    }
  }
  try{audio.currentTime=target}catch(_){return}
  paintAudioProgress(p);
}
