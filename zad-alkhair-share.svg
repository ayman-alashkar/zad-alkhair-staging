<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">كَلَامُ البَارِي يَجْمَعُنَا</title>
  <desc id="desc">صورة مشاركة مستمدة من الهوية البصرية لتطبيق زاد الخير</desc>

  <defs>
    <linearGradient id="night" x1="52" y1="18" x2="1148" y2="612" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#061F1D"/>
      <stop offset=".44" stop-color="#082D29"/>
      <stop offset="1" stop-color="#0B3832"/>
    </linearGradient>

    <radialGradient id="warmLight" cx="0" cy="0" r="1" gradientTransform="translate(120 44) scale(400)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E4C980" stop-opacity=".13"/>
      <stop offset="1" stop-color="#E4C980" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="greenLight" cx="0" cy="0" r="1" gradientTransform="translate(1104 139) scale(512)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#49A18C" stop-opacity=".18"/>
      <stop offset="1" stop-color="#49A18C" stop-opacity="0"/>
    </radialGradient>

