      <rect width="84" height="144" fill="url(#g60)"/>
    </pattern>
    <linearGradient id="sideFade" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="white"/>
      <stop offset=".44" stop-color="white" stop-opacity="0"/>
      <stop offset=".56" stop-color="white" stop-opacity="0"/>
      <stop offset="1" stop-color="white"/>
    </linearGradient>
    <mask id="sideMask"><rect width="1200" height="630" fill="url(#sideFade)"/></mask>

    <radialGradient id="archGlow" cx="50%" cy="15%" r="72%">
      <stop stop-color="#E4C980" stop-opacity=".09"/>
      <stop offset=".62" stop-color="#FFF9EA" stop-opacity=".025"/>
      <stop offset="1" stop-color="#FFF9EA" stop-opacity="0"/>
