.rule i{font-family:var(--sans)}
.eyebrow{font-size:.68rem;font-weight:700;letter-spacing:.14em;color:var(--brand)}
.brand{color:var(--brand)}
.gate::before{content:"✦";place-items:center;width:54px;height:54px;margin:0 auto 1.3rem;border-radius:18px;color:#fff;font-size:1.25rem;background:linear-gradient(145deg,#1A806E,var(--brand-strong));box-shadow:0 18px 38px -20px rgba(15,92,80,.8)}
.gate .brand{max-width:12ch;margin-inline:auto}
.gate .lede{max-width:42ch;margin-inline:auto}
.gate .frame.card{text-align:start}
.joining{color:var(--muted)}
.joining b{letter-spacing:.12em}
.hero .display{position:relative;z-index:1}
.orbs{margin-top:1.5rem}
.orbs>.shamsa,.orbs>.zcol{width:100%;min-height:330px;margin:0;padding:1rem;border:1px solid rgba(220,231,226,.9);border-radius:22px;background:rgba(247,250,248,.74);box-shadow:var(--shadow-sm)}
.zcol{justify-content:center}
.stats{margin-top:1rem}
.ptline{margin-top:1rem}
.userbar{margin-top:1rem}
.sec-head h2.sec::before{border-radius:999px}
.cell.taken::after{background:var(--green)}
.cell.taken .num,.cell.taken .who{color:#0B8169}
.cell.done::after{background:var(--gold)}
.cell.done .num,.cell.done .who{color:#9A711F}
.field{font-family:var(--sans)}
.roster-row .rwho{flex-basis:10.5rem}
.roster-row .rtag{flex-basis:6.3rem}
.dots{font-size:1rem}
.hsec li::before{color:var(--brand)}
.modal .frame{border-color:rgba(255,255,255,.68)}
.dtgrid{gap:.75rem}
.cd-g{font-weight:650}
@media (max-width:900px){
  .grid{grid-template-columns:repeat(5,minmax(0,1fr))}
  .orbs>.shamsa,.orbs>.zcol{min-height:300px}
  .orbs>.shamsa{height:300px}
}
@media (max-width:720px){
  body{padding-top:5.15rem}
  .topbar{inset-inline:.7rem;top:max(.5rem,env(safe-area-inset-top))}
  .topbar::after{display:none}
  .orbs{grid-template-columns:1fr}
  .orbs>.shamsa,.orbs>.zcol{min-height:auto}
  .orbs>.shamsa{width:min(100%,360px);height:auto;margin-inline:auto}
  .stats{grid-template-columns:1fr 1fr}
  .stats span:first-child{grid-column:1/-1}
  .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:560px){
  :root{--r-lg:21px;--r-md:16px}
  body{font-size:14px}
  .wrap{padding-inline:.85rem}
  .hero{padding:1.1rem}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:.55rem}
  .cell{min-height:114px;border-radius:15px;padding:.75rem .45rem .65rem}
  .cell .num{font-size:1.5rem}
  .cell .range{font-size:.7rem}
  .legend{width:100%;justify-content:space-between;padding:.5rem .1rem 0}
  .userbar{border-radius:16px}
  .userbar>.spacer{display:none}
  .userbar .btn{margin-inline-start:auto}
  .userbar .btn+.btn{margin-inline-start:0}
  .roster-row .rwho{flex:1 1 auto;max-width:none}
  .roster-row .rtag{display:none}
  .toolbar{padding:.8rem}
}
@media (max-width:390px){
  .topbar{min-height:50px}
  .topbar .tb-brand::before{width:31px;height:31px;border-radius:10px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
}
/* تصميم جديد بالكامل: مشكاة رقمية معاصرة بروح المخطوط القرآني */
:root{--paper:#F5F0E4;--paper2:#FFFCF4;--sand:#EAE1CF;--ink:#132823;--muted:#746F63;--line:#DED3BD;--blue:#3A7285;--blue-soft:#E4EFF0;--green:#1B705F;--green-soft:#DDECE5;--gold:#C59A4A;--gold-hi:#E4C980;--gold-soft:#F4E8CA;--walnut:#724C2B;--rose:#B95157;--night:#082D29;--night-2:#0D3C35;--night-3:#155449;--ivory:#FFF9EA;--ruqaa:"Aref Ruqaa",serif;--naskh:"Amiri",serif;--sans:"Alexandria","Segoe UI",Tahoma,sans-serif;--sp:clamp(1rem,3.8vw,2rem);--r-lg:32px;--r-md:18px;--r-sm:12px;--shadow:0 32px 90px -45px rgba(0,0,0,.72);--shadow-sm:0 18px 42px -28px rgba(0,0,0,.58)}
html{background:var(--night);scroll-behavior:smooth}
body{min-height:100vh;padding:7rem 0 max(5rem,env(safe-area-inset-bottom));color:var(--ivory);font-family:var(--sans);font-size:15px;line-height:1.75;background:radial-gradient(circle at 10% 7%,rgba(228,201,128,.13),transparent 25rem),
    radial-gradient(circle at 92% 22%,rgba(73,161,140,.18),transparent 32rem),
    linear-gradient(145deg,#061F1D 0%,var(--night) 44%,#0B3832 100%)}
body::before{inset:0;opacity:.24;background-image:linear-gradient(30deg,rgba(228,201,128,.18) 12%,transparent 12.5%,transparent 87%,rgba(228,201,128,.18) 87.5%),
    linear-gradient(150deg,rgba(228,201,128,.18) 12%,transparent 12.5%,transparent 87%,rgba(228,201,128,.18) 87.5%),
    linear-gradient(30deg,rgba(228,201,128,.18) 12%,transparent 12.5%,transparent 87%,rgba(228,201,128,.18) 87.5%),
    linear-gradient(150deg,rgba(228,201,128,.18) 12%,transparent 12.5%,transparent 87%,rgba(228,201,128,.18) 87.5%),
    linear-gradient(60deg,rgba(228,201,128,.08) 25%,transparent 25.5%,transparent 75%,rgba(228,201,128,.08) 75%);background-position:0 0,0 0,42px 72px,42px 72px,0 0;background-size:84px 144px;-webkit-mask-image:linear-gradient(90deg,black,transparent 44%,transparent 56%,black);mask-image:linear-gradient(90deg,black,transparent 44%,transparent 56%,black)}
body::after{content:"";position:fixed;z-index:0;pointer-events:none;width:46vw;height:46vw;max-width:720px;max-height:720px;inset-inline-end:-25vw;bottom:-28vw;border:1px solid rgba(228,201,128,.14);border-radius:50%;box-shadow:0 0 0 44px rgba(228,201,128,.025),0 0 0 88px rgba(228,201,128,.018)}
.wrap{max-width:1260px;padding-inline:var(--sp)}
.topbar::after{display:none}
.topbar span,.topbar .tb-brand{display:flex;align-items:center;gap:.7rem;font-family:var(--ruqaa);font-size:1.25rem;font-weight:700;line-height:1.3;color:var(--ivory);background:none;-webkit-text-fill-color:currentColor}
.topbar .tb-brand::before{width:40px;height:40px;place-items:center;border:1px solid rgba(228,201,128,.55);border-radius:50% 50% 14px 14px;color:#18362F;background:linear-gradient(145deg,var(--gold-hi),var(--gold));box-shadow:0 13px 30px -16px rgba(228,201,128,.75);font-family:var(--naskh);font-size:1.45rem;font-weight:700}
.tb-help{min-height:40px;padding:.4rem .72rem;border:1px solid rgba(255,249,234,.14);border-radius:12px;color:rgba(255,249,234,.72);box-shadow:none}
.tb-help:hover{border-color:rgba(228,201,128,.55);background:rgba(228,201,128,.08);color:var(--ivory)}
.tb-help i{font-family:var(--sans);font-weight:700}
.brand,.display{font-family:var(--ruqaa);font-weight:700;line-height:1.5;padding:.06em 0 .16em;color:var(--ivory);background:none;-webkit-text-fill-color:currentColor;letter-spacing:0}
.brand{font-size:clamp(3.4rem,8vw,7.2rem)}
.display{font-size:clamp(2.2rem,5vw,3.8rem)}
.lede{font-family:var(--naskh);font-size:clamp(1.15rem,2.2vw,1.45rem);color:rgba(255,249,234,.70);line-height:2}
h2.sec{font-family:var(--ruqaa);font-size:1.65rem;font-weight:700;color:var(--ink);line-height:1.5}
.rule{gap:.85rem;margin:1.05rem 0}
.rule::before,.rule::after{background:linear-gradient(90deg,transparent,rgba(228,201,128,.48),transparent)}
.rule i{color:var(--gold-hi);font-size:.58rem;letter-spacing:.3em}
.frame{color:var(--ink);border:1px solid rgba(228,201,128,.32);border-radius:var(--r-lg);background:radial-gradient(circle at 8% 0%,rgba(197,154,74,.09),transparent 18rem),linear-gradient(145deg,#FFFDF7,var(--paper));box-shadow:var(--shadow);backdrop-filter:none}
.frame::before{display:none}
/* افتتاحية مشكاة غير متماثلة */
.gate{position:relative;z-index:1;padding:clamp(2.5rem,7vh,5rem) 0 2rem;text-align:center;max-width:590px}
.gate::before{display:none}
.home-gate{max-width:1180px;min-height:calc(100vh - 12rem);padding:1.5rem 0 3rem;display:grid;grid-template-columns:minmax(0,1.18fr) minmax(350px,.82fr);grid-template-rows:auto auto 1fr;align-content:center;column-gap:clamp(3rem,8vw,8rem);text-align:start;isolation:isolate}
.home-gate::before{content:"";display:block;position:absolute;z-index:-1;pointer-events:none;inset-block:0;inset-inline-start:-3%;width:58%;border:1px solid rgba(228,201,128,.24);border-bottom:0;border-radius:48% 48% 28px 28px/28% 28% 28px 28px;background:radial-gradient(circle at 50% 17%,rgba(228,201,128,.11),transparent 16rem),linear-gradient(180deg,rgba(255,249,234,.035),rgba(255,249,234,.012));box-shadow:inset 0 0 90px rgba(228,201,128,.035),0 0 0 16px rgba(228,201,128,.018)}
.home-gate::after{position:absolute;z-index:0;pointer-events:none;inset-inline-start:calc(29% - 1.5rem);top:8%;width:3rem;height:3rem;place-items:center;color:var(--gold-hi);font-size:1.2rem;border:1px solid rgba(228,201,128,.35);border-radius:50%;background:var(--night);box-shadow:0 0 0 8px rgba(8,45,41,.9)}
.home-gate>.brand{grid-column:1;grid-row:1;position:relative;z-index:1;align-self:end;max-width:8ch;color:var(--ivory)}
.home-gate>.rule{grid-column:1;grid-row:2;width:min(360px,72%);margin:.8rem 0}
.home-gate>.lede{grid-column:1;grid-row:3;max-width:31ch;margin:0;font-size:clamp(1.25rem,2.5vw,1.65rem)}
.home-gate>.card{grid-column:2;grid-row:1/4;align-self:center;margin:0 !important;padding:clamp(1.5rem,3vw,2.35rem);border-radius:170px 170px 28px 28px;position:relative;overflow:hidden}
.home-gate>.card::before{content:"";display:block;position:absolute;inset:10px;border:1px solid rgba(197,154,74,.22);border-radius:155px 155px 20px 20px;pointer-events:none}
.home-gate>.card>*{position:relative;z-index:1}
.home-gate>.card .btn.gold{margin-top:4.8rem}
.home-gate>.card .hint{text-align:center}
.gate:not(.home-gate)>.display,.gate:not(.home-gate)>.brand{color:var(--ivory)}
.gate:not(.home-gate)>.joining{color:rgba(255,249,234,.62)}
.gate:not(.home-gate)>.lede{color:rgba(255,249,234,.72)}
.gate:not(.home-gate)>.card{border-radius:120px 120px 28px 28px;padding:clamp(2.5rem,6vw,4.5rem) clamp(1.25rem,4vw,2rem) 1.8rem}
.joining{font-family:var(--sans);font-size:.72rem;font-weight:600;letter-spacing:.08em}
.joining b{font-family:var(--sans);font-size:.95rem;color:var(--gold-hi)}
.card{margin-top:1.8rem;padding:clamp(1.35rem,4vw,2rem)}
/* حقول وأزرار */
button,input,select,textarea{font-family:var(--sans)}
.btn{min-height:46px;padding:.62rem 1.05rem;border:1px solid #D8CDB7;border-radius:12px;background:rgba(255,253,247,.84);color:var(--ink);font-weight:650;box-shadow:0 10px 24px -21px rgba(0,0,0,.55);transition:transform .16s,border-color .2s,background .2s,box-shadow .2s}
.btn:hover{border-color:var(--gold);background:#fff;box-shadow:0 16px 28px -22px rgba(0,0,0,.52)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn:focus-visible{outline:3px solid rgba(197,154,74,.28);outline-offset:2px}
.btn.gold{color:#19332C;border-color:var(--gold);background:linear-gradient(135deg,var(--gold-hi),var(--gold));box-shadow:0 15px 32px -18px rgba(132,89,22,.72)}
.btn.gold:hover{border-color:#A97B2C;background:linear-gradient(135deg,#EBD594,#B98934)}
.btn.blue{color:#fff;border-color:var(--blue);background:var(--blue)}
.btn.green{color:#fff;border-color:var(--green);background:linear-gradient(135deg,#278573,#145F51)}
.btn.quiet{color:var(--muted);background:transparent;border-color:transparent;box-shadow:none}
.btn.quiet:hover{color:var(--ink);border-color:#DDD1BA;background:rgba(255,255,255,.46)}
.userbar .btn.quiet,.toolbar .btn.quiet{color:rgba(255,249,234,.72)}
.userbar .btn.quiet:hover,.toolbar .btn.quiet:hover{color:var(--ivory);border-color:rgba(228,201,128,.35);background:rgba(255,255,255,.06)}
.btn.danger{color:var(--rose);background:rgba(185,81,87,.06);border-color:rgba(185,81,87,.35);box-shadow:none}
.btn.sm{min-height:36px;padding:.34rem .72rem;font-size:.72rem;border-radius:10px}
.field{min-height:50px;padding:.72rem .9rem;border:1px solid #D8CEBB;border-radius:12px;background:rgba(255,253,247,.82);color:var(--ink);font-size:.88rem}
.field:hover{border-color:#C7B898;background:#fff}
.field:focus{border-color:var(--gold);background:#fff;box-shadow:0 0 0 4px rgba(197,154,74,.13)}
.field-row label{font-size:.72rem;font-weight:650;color:#685F50;margin-bottom:.42rem}
.hint{font-size:.72rem;color:var(--muted);line-height:1.85}
.codebox{font-family:var(--sans);font-size:1.45rem;font-weight:700;letter-spacing:.4em;border-style:dashed;background:#FBF6EA}
.codebig{font-family:var(--ruqaa);font-size:3.2rem;font-weight:700;color:var(--walnut);background:none;-webkit-text-fill-color:currentColor}
.linkbox{font-size:.72rem;background:#F0E9DB;border:1px dashed #BBAA89;border-radius:12px;color:var(--walnut)}
.codechip{border-color:rgba(228,201,128,.28);border-radius:12px;padding:.38rem .75rem;background:rgba(255,249,234,.07);color:rgba(255,249,234,.64)}
.codechip b{font-family:var(--sans);font-size:.92rem;font-weight:800;letter-spacing:.12em;color:var(--gold-hi)}
/* لوحة ختمة بتكوين أفقي */
.khatma-shell{position:relative}
.hero{position:relative;overflow:hidden;margin-top:.35rem;padding:clamp(1.4rem,3.2vw,2.6rem);display:grid;gap:1rem 1.15rem;text-align:start;border-radius:44px;background:radial-gradient(circle at 100% 0%,rgba(197,154,74,.18),transparent 28rem),linear-gradient(135deg,#FFFEFA 0%,#F4EDDE 100%)}
.hero::after{content:"";position:absolute;z-index:0;pointer-events:none;width:330px;height:330px;inset-inline-end:-150px;top:-175px;border:1px solid rgba(114,76,43,.16);border-radius:50%;box-shadow:0 0 0 28px rgba(114,76,43,.025),0 0 0 56px rgba(114,76,43,.018)}
.hero-intro{grid-area:intro;position:relative;z-index:1;padding:.3rem .4rem .2rem}
.hero .display{color:var(--ink);font-size:clamp(2.35rem,5vw,4rem)}
.hero .dedication{font-family:var(--naskh);font-size:1.2rem;color:var(--walnut);margin-top:-.15rem}
.orbs{grid-area:orbs;position:relative;z-index:1;display:grid;align-items:center;gap:1rem;margin:0;padding:clamp(.9rem,2vw,1.4rem);border:1px solid rgba(228,201,128,.2);border-radius:26px;background:radial-gradient(circle at 30% 30%,rgba(228,201,128,.14),transparent 18rem),linear-gradient(145deg,var(--night-2),var(--night));box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 20px 50px -34px rgba(0,0,0,.8)}
.orbs>.shamsa{width:min(100%,330px);height:auto;margin:auto;padding:0;background:none;border:0;box-shadow:none}
.orbs>.zcol{width:100%;min-height:0;margin:0;padding:0;background:none;border:0;box-shadow:none;color:var(--ivory)}
.zclock{width:min(255px,100%);filter:drop-shadow(0 15px 24px rgba(0,0,0,.22))}
.stats{grid-area:stats;position:relative;z-index:1;display:grid;grid-template-columns:1fr;align-content:stretch;gap:.65rem;margin:0}
.stats span{min-height:0;padding:1rem 1.05rem;display:flex;flex-direction:column;justify-content:center;text-align:start;border:1px solid #DDD0B7;border-radius:22px 22px 8px 8px;background:rgba(255,252,244,.72)}
.stats em{font-family:var(--sans);font-size:.62rem;font-weight:650;letter-spacing:.06em;color:var(--muted)}
.stats b{font-family:var(--naskh);font-size:1.12rem;font-weight:700;color:var(--ink);line-height:1.6}
.stats b i{color:var(--walnut);font-weight:400}
.stats b i::before{color:#B6A990}
.ptline{grid-area:prayer;position:relative;z-index:1;margin:0;padding:.9rem 1rem;border:1px solid #D8CCB4;border-radius:15px;background:rgba(255,252,244,.68);font-family:var(--sans)}
.ptline:hover{border-color:var(--gold);background:#FFFCF4}
.ptline .pt-icon{color:var(--walnut)}
.ptline .pt-label{font-weight:700}
.ptline .pt-next{font-family:var(--naskh);font-size:1.04rem;color:var(--walnut)}
.ptline .pt-chev{color:#9F8D6A}
.cdown{color:var(--ivory)}
.cd-lab{font-size:.62rem;font-weight:650;letter-spacing:.08em;color:rgba(255,249,234,.6)}
.cd-cell{min-width:2.85rem;padding:.35rem .28rem;border-radius:10px;border-color:rgba(228,201,128,.18);background:rgba(255,249,234,.06);box-shadow:none}
.cd-cell b{font-family:var(--sans);font-size:1rem;font-weight:750;color:var(--gold-hi)}
.cd-cell em{color:rgba(255,249,234,.5)}
.cd-g{font-family:var(--naskh);font-size:1rem;color:var(--ivory)}
.cd-hij{color:rgba(255,249,234,.55)}
.userbar{position:relative;z-index:3;padding:.72rem .9rem;gap:.58rem;border:1px solid rgba(228,201,128,.27);border-radius:18px;background:rgba(6,34,31,.88);color:var(--ivory);box-shadow:0 18px 40px -28px rgba(0,0,0,.9);backdrop-filter:blur(18px)}
.avatar{width:36px;height:36px;border-radius:50% 50% 11px 11px;font-family:var(--sans);font-size:.82rem;font-weight:750;color:#1B342D;background:linear-gradient(145deg,var(--gold-hi),var(--gold));box-shadow:0 10px 22px -13px rgba(228,201,128,.72)}
.tag{font-size:.61rem;font-weight:650;padding:.18rem .5rem;border-radius:6px;background:var(--gold-soft);color:#75561B}
.tag.j{background:var(--green-soft);color:#155F50}
.tag.ex{background:var(--blue-soft);color:#2D6476}
.tag.warn{background:#F4DFDF;color:#9A3F45}
/* مجلس الأجزاء ورواق المشاركين */
.main-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:1.15rem;align-items:start;margin-top:2.4rem}
.juz-panel,.people-panel{min-width:0;border:1px solid rgba(228,201,128,.22);border-radius:32px}
.juz-panel{padding:clamp(1rem,2.4vw,1.55rem);color:var(--ink);background:radial-gradient(circle at 0 0,rgba(197,154,74,.10),transparent 22rem),linear-gradient(145deg,#FFFDF7,var(--paper));box-shadow:var(--shadow)}
.people-panel{position:sticky;top:6.4rem;padding:1rem;background:rgba(255,249,234,.055);backdrop-filter:blur(12px)}
.sec-head{margin:0 0 1rem;align-items:center}
.sec-head h2.sec{display:flex;align-items:center;gap:.65rem}
.sec-head h2.sec::before{content:"";width:17px;height:17px;border:1px solid var(--gold);transform:rotate(45deg);background:rgba(197,154,74,.08);box-shadow:inset 0 0 0 4px #FFFDF7}
.people-panel .sec-head h2.sec,.people-panel .sec-head>span{color:var(--ivory) !important}
.people-panel .sec-head h2.sec::before{box-shadow:inset 0 0 0 4px var(--night);border-color:var(--gold-hi)}
.legend{gap:.85rem;font-size:.68rem;color:var(--muted)}
.legend b{font-weight:600}
.legend b::before{width:8px;height:8px;border-radius:3px 3px 50% 50%;box-shadow:none}
.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:.7rem}
.cell{--state:var(--blue);position:relative;min-height:142px;padding:1.15rem .65rem .72rem;gap:.22rem;overflow:hidden;border:1px solid #DDD2BD;border-radius:58px 58px 16px 16px;background:rgba(255,253,247,.82);color:var(--ink);box-shadow:0 12px 26px -24px rgba(50,37,18,.55);transition:transform .22s cubic-bezier(.2,.8,.3,1),box-shadow .22s,border-color .22s,background .22s}
.cell::before{content:"";position:absolute;top:11px;left:50%;width:7px;height:7px;border-radius:50%;background:var(--state);transform:translateX(-50%);box-shadow:0 0 0 4px color-mix(in srgb,var(--state) 13%,transparent)}
.cell::after{content:"";position:absolute;inset-inline:18px;bottom:0;height:3px;border-radius:8px 8px 0 0;background:var(--state)}
.cell:hover{transform:translateY(-5px);border-color:var(--state);background:#fff;box-shadow:0 24px 38px -26px rgba(50,37,18,.55)}
.cell:focus-visible{outline:3px solid color-mix(in srgb,var(--state) 26%,transparent);outline-offset:2px}
.cell .num{font-family:var(--ruqaa);font-size:2.25rem;font-weight:700;line-height:1.3;color:var(--state)}
.cell .range{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-family:var(--naskh);font-size:.78rem;color:var(--muted);line-height:1.45}
.cell .who{font-size:.63rem;font-weight:650;margin-top:.12rem;line-height:1.9;padding-block:.06rem;color:var(--state)}
.cell.done{--state:var(--gold);background:#FCF8EC}

/* ═══ الصفحة الرئيسية: توسيط العمود الأوّل وتذهيب الاسم ═══
   على الحاسب كان العمود مصطفًّا إلى البداية، فوُسِّط هو وحده
   دون أن تُمسّ بطاقة الانضمام في العمود الثاني. */
.home-gate>.brand,.home-gate>.rule,.home-gate>.lede{
  margin-inline:auto;text-align:center}
.home-gate>.rule{justify-content:center}

/* التدرّج من العاج إلى الذهب، بقيم التطبيق نفسها لا بغيرها:
   ‎--ivory‎ ← ‎--gold-hi‎ ← ‎--gold‎ */
.home-gate>.brand{
  background:linear-gradient(160deg,
    var(--ivory) 14%, var(--gold-hi) 56%, var(--gold) 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent}

/* ═══ اسم التطبيق زرًّا ═══
   لا صندوق ولا إطار: يبقى كما كان نصًّا في الشريط.
   يُجرَّد من مظهر الزرّ الافتراضي فحسب، ويُعطى مؤشّرًا.
   والضغط تحكمه قاعدة التطبيق العامّة:
   :where(button,a,summary,[role="button"]):active
   فلا قاعدة خاصّة تغلبها. */
.topbar .tb-brand{-webkit-appearance:none;appearance:none;
  background:none;border:0;padding:0;margin:0;
  cursor:pointer;color:inherit}
/* التوهّج عند المرور لأجهزة المؤشّر وحدها، فلا يلتصق بعد اللمس */
@media (hover:hover) and (pointer:fine){
  .topbar .tb-brand{transition:opacity .18s}
  .topbar .tb-brand:hover{opacity:.82}
}
.topbar .tb-brand:focus-visible{outline:3px solid rgba(197,154,74,.28);outline-offset:3px;border-radius:8px}

/* ═══ سلاسة التمرير ═══
   كانت خلفية body ثلاثة تدرّجات بـbackground-attachment:fixed،
   وهي تُعاد رسمها في كل إطار تمرير — أثقل ما في الصفحة على الجوّال.
   نُقلت إلى طبقة مثبَّتة خلف كل شيء: المنظر نفسه حرفًا بحرف،
   لكنها تُرسم مرّة واحدة ولا تُعاد مع التمرير. */
html{background:#061F1D}
body{background:none}
.bg-veil{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(circle at 10% 7%,rgba(228,201,128,.13),transparent 25rem),
    radial-gradient(circle at 92% 22%,rgba(73,161,140,.18),transparent 32rem),
    linear-gradient(145deg,#061F1D 0%,var(--night) 44%,#0B3832 100%)}

/* ═══ ختماتي: عنوان مركزي يفتح قائمة منسدلة ═══ */
.mine-strip{grid-column:1/-1;grid-row:4;width:min(100%,620px);justify-self:center;
  margin:clamp(1.6rem,4vw,2.8rem) auto .2rem;text-align:center}
.mine-toggle{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  margin:0 auto;padding:.34rem .9rem;list-style:none;cursor:pointer;user-select:none;
  border:0;border-bottom:1px solid rgba(228,201,128,.36);background:transparent;
  color:var(--ivory);font-family:var(--ruqaa);font-size:clamp(1.25rem,2.5vw,1.55rem);
  font-weight:700;line-height:1.7}
.mine-toggle::-webkit-details-marker{display:none}
.mine-toggle::after{content:"⌄";font-family:var(--sans);font-size:.78rem;color:var(--gold-hi);
  transition:transform .18s ease}
.mine-strip[open] .mine-toggle::after{transform:rotate(180deg)}
.mine-toggle:focus-visible{outline:3px solid rgba(197,154,74,.28);outline-offset:3px;border-radius:9px}
.mine-row{width:min(100%,540px);max-height:300px;overflow-y:auto;display:grid;gap:.38rem;
  margin:.65rem auto 0;padding:.48rem;border:1px solid rgba(228,201,128,.24);
  border-radius:18px;background:rgba(5,31,28,.84);box-shadow:0 24px 52px -34px rgba(0,0,0,.95);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.mine-row::-webkit-scrollbar{width:4px}
.mine-row::-webkit-scrollbar-thumb{background:rgba(228,201,128,.3);border-radius:9px}
.mine-card{width:100%;min-width:0;max-width:none;display:grid;grid-template-columns:minmax(0,1fr) auto;
  align-items:center;gap:.7rem;text-align:start;cursor:pointer;padding:.68rem .82rem;border-radius:12px;
  border:1px solid transparent;background:rgba(255,255,255,.035);color:var(--ivory);
  transition:border-color .2s,background .2s}
.mine-card b{min-width:0;font-family:var(--ruqaa);font-size:1rem;font-weight:700;line-height:1.7;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mine-card span{font-size:.67rem;color:rgba(255,249,234,.62);white-space:nowrap}
@media (hover:hover) and (pointer:fine){
  .mine-card:hover{border-color:rgba(228,201,128,.52);background:rgba(228,201,128,.09)}
}

/* ═══ القائمة الوسطية في الشريط العلوي ═══
   في الرئيسية تعرض «ختماتي»، وداخل الختمة يتحول الموضع نفسه إلى اسم
   القارئ بعد تجاوز شريط المستخدم. */
.tb-user{-webkit-appearance:none;appearance:none;border:0;background:transparent;padding:.25rem .6rem;
  min-height:34px;border-radius:10px;cursor:pointer;text-align:center}
body.show-home-mine .tb-user,body.show-top-user .tb-user{pointer-events:auto}
body.show-home-mine .tb-user{font-family:var(--ruqaa)!important;font-size:1.02rem!important;font-weight:700!important}
body.show-top-user .tb-user{font-family:var(--ruqaa)!important;font-weight:700!important}
.tb-user:hover{background:rgba(228,201,128,.07)}
.tb-user:focus-visible{outline:3px solid rgba(197,154,74,.3);outline-offset:2px}
.tb-user::after{content:"⌄";display:inline-block;margin-inline-start:.35rem;font-family:var(--sans);
  font-size:.62rem;color:rgba(228,201,128,.82);transition:transform .18s}
.tb-user[aria-expanded="true"]::after{transform:rotate(180deg)}
.tb-popover{position:fixed;z-index:39;top:max(4.45rem,calc(env(safe-area-inset-top) + 4.1rem));
  left:50%;width:min(330px,calc(100vw - 1.4rem));max-height:min(430px,70vh);overflow:auto;
  transform:translateX(-50%);padding:.5rem;border:1px solid rgba(228,201,128,.34);border-radius:16px;
  background:rgba(7,39,35,.985);color:var(--ivory);box-shadow:0 24px 54px -30px rgba(0,0,0,.92)}
.tb-popover[hidden]{display:none!important}
.tb-menu-title{padding:.38rem .55rem .5rem;text-align:center;font-family:var(--ruqaa);font-size:1.12rem;
  font-weight:700;color:var(--gold-hi);border-bottom:1px solid rgba(228,201,128,.16);margin-bottom:.35rem}
.tb-menu-item{width:100%;display:flex;align-items:center;justify-content:space-between;gap:.7rem;
  min-height:42px;padding:.55rem .68rem;border:1px solid transparent;border-radius:10px;background:transparent;
  color:var(--ivory);font-family:var(--sans);font-size:.78rem;font-weight:600;text-align:start;cursor:pointer}
.tb-menu-item small{font-size:.62rem;font-weight:400;color:rgba(255,249,234,.52);white-space:nowrap}
.tb-menu-item:hover{border-color:rgba(228,201,128,.22);background:rgba(228,201,128,.075)}
.tb-menu-item.danger{color:#F0B4B0}
.tb-menu-back{color:rgba(255,249,234,.65)}
.tb-menu-empty{padding:.85rem .65rem;text-align:center;font-size:.73rem;color:rgba(255,249,234,.6)}

/* ═══ طبقة أداء للحاسب ═══
   أهم كلفة أثناء التمرير كانت مزج عدة backdrop-filter فوق خلفية ثابتة.
   نجعل الأسطح نفسها شبه معتمة ونوقف أخذ عينة الخلفية في كل إطار؛
   لا يتغير التخطيط ولا الوظائف ولا الألوان الأساسية. */
@media (min-width:861px){
  .topbar,.frame,.userbar,.people-panel,.toolbar,.mine-row{
    backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
  .topbar{background:linear-gradient(180deg,rgba(5,29,27,.995) 0%,rgba(5,29,27,.94) 68%,rgba(5,29,27,0) 100%)!important}
  .userbar{background:rgba(6,34,31,.975)}
  .people-panel{background:rgba(255,249,234,.07)}
  .toolbar{background:rgba(5,31,28,.93)}
  .mine-row{background:rgba(5,31,28,.97)}
  .bg-veil,body::before,body::after{transform:translateZ(0);backface-visibility:hidden}
  .cell,.khatmah-card{contain:paint}
}

@media (prefers-reduced-motion:reduce){
  .tgbig .tgicon{animation:none}
}
/* ترويسة ممتزجة بالخلفية بدل الكيان العائم، موحّدة على الهاتف والحاسب. */
.topbar{top:0;inset-inline:0;min-height:72px;padding:max(.72rem,env(safe-area-inset-top)) max(1rem,calc((100vw - 1220px)/2)) 1rem;border:0;border-radius:0;box-shadow:none;background:linear-gradient(180deg,rgba(5,29,27,.97) 0%,rgba(5,29,27,.86) 68%,rgba(5,29,27,0) 100%);backdrop-filter:blur(9px) saturate(118%);-webkit-backdrop-filter:blur(9px) saturate(118%)}
.topbar .tb-brand,.topbar .tb-user{text-shadow:0 2px 12px rgba(0,0,0,.22)}
.tb-help{background:rgba(255,249,234,.055);border-color:rgba(228,201,128,.18)}
/* الحالة اللونية نفسها في كل المقاسات. */
.cell.taken{--state:#287A65;border-color:#75AF9D;background:linear-gradient(180deg,#E8F5F0 0%,#CFE8DE 100%);box-shadow:inset 0 0 0 1px rgba(40,122,101,.1),0 12px 26px -24px rgba(14,72,58,.55)}
.cell.taken::before{box-shadow:0 0 0 4px rgba(40,122,101,.14)}
.cell.taken .range{color:#496A61}
.cell.done{border-color:#D4AE5C}
/* عنوان الختمة ونص النية بهوية النسخة الأصلية. */
.hero-intro{width:100%;text-align:center}
.hero-intro .display{font-family:"Aref Ruqaa",serif;font-weight:700;line-height:1.9;padding:.12em 0 .22em;text-align:center;letter-spacing:0;background:linear-gradient(170deg,#D9A63F,#C08A2B 45%,#8A5A18);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.hero-intro .dedication{width:100%;margin-inline:auto;text-align:center}
/* معلومات المشاركين وصفّهم موحّدة في جميع المقاسات. */
.roster-list{grid-template-columns:1fr}
.roster-row{display:grid;grid-template-columns:28px minmax(0,1fr) 5.5rem 2rem 1.9rem;align-items:center;column-gap:.38rem;padding:.72rem .12rem;white-space:normal;font-size:.78rem}
.roster-row .avatar{width:28px;height:28px;font-size:.68rem}
.roster-row .rwho{display:flex;align-items:center;min-width:0;max-width:none;gap:.3rem;row-gap:.12rem;flex-wrap:wrap;overflow:visible}
.roster-row .rname{display:block;min-width:0;max-width:100%;overflow:visible;text-overflow:clip;white-space:normal;overflow-wrap:anywhere;line-height:1.55;font-weight:400 !important}
.roster-row .rwho .tag{display:inline-flex;flex:0 0 auto;margin:0;padding:.12rem .34rem;font-size:.54rem;white-space:nowrap}
.roster-row .rtag{display:flex !important;min-width:0;align-self:center;justify-content:flex-start;white-space:nowrap}
.roster-row .rtag .tag{padding:.13rem .32rem;font-size:.56rem}
.roster-row .n{min-width:0;text-align:center;font-size:.67rem;white-space:nowrap}
.roster-row .dots,.roster-row .dots-gap{width:1.9rem;min-width:1.9rem}
@media (min-width:1061px){
  .main-layout{grid-template-columns:minmax(0,1fr) 360px}
}
@media (min-width:951px) and (max-width:1060px){
  .main-layout{grid-template-columns:minmax(0,1fr) 320px}
}
@media (max-width:420px){
  .people-panel>.roster-list{padding-inline:.38rem !important}
  .roster-row{grid-template-columns:26px minmax(0,1fr) 5.15rem 1.75rem 1.8rem;column-gap:.28rem;font-size:.73rem}
  .roster-row .avatar{width:26px;height:26px;font-size:.63rem}
  .roster-row .rtag .tag{padding-inline:.25rem;font-size:.53rem}
  .roster-row .n{font-size:.63rem}
  .roster-row .dots,.roster-row .dots-gap{width:1.8rem;min-width:1.8rem}
}
/* نافذة المواقيت كاملة بلا شريط تمرير. */
.prayer-times-modal{overflow:hidden}
.prayer-times-modal .frame{display:flex;flex-direction:column;overflow:hidden;max-height:calc(100dvh - 1.2rem)}
.prayer-times-modal .ptable{flex:0 1 auto}
@media (max-height:660px){
  .prayer-times-modal .frame{padding:.72rem 1rem}
  .prayer-times-modal .prayer-emblem{width:40px;height:40px;margin-bottom:.28rem;border-radius:13px 13px 8px 8px}
  .prayer-times-modal .prayer-emblem .zk-icon{width:24px;height:24px}
  .prayer-times-modal .display{font-size:1.12rem !important}
  .prayer-times-modal .prayer-head{margin-bottom:.38rem}
  .prayer-times-modal .prayer-head .ptcity{font-size:.98rem;margin-bottom:.05rem}
  .prayer-times-modal .prayer-date-g{font-size:.84rem}
  .prayer-times-modal .prayer-date-h{font-size:.75rem}
  .prayer-times-modal .ptable{margin:.28rem 0}
  .prayer-times-modal .ptrow{padding:.34rem .75rem}
  .prayer-times-modal .ptrow .pv{font-size:.84rem}
  .prayer-times-modal .ptrow .pn{font-size:.8rem}
  .prayer-times-modal .actions{margin-top:.5rem}
  .prayer-times-modal .btn{min-height:38px;padding:.4rem .85rem}
}
@media (max-width:680px){
  .topbar{min-height:62px;padding:max(.5rem,env(safe-area-inset-top)) .72rem .82rem;background:linear-gradient(180deg,rgba(5,29,27,.98) 0%,rgba(5,29,27,.86) 68%,rgba(5,29,27,0) 100%);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .prayer-fab .pt-icon{width:26px;height:26px;border-radius:9px}
  .prayer-fab .pt-icon .zk-icon{width:17px;height:17px}
  .rb-icon{width:2.2rem !important;height:2.2rem !important}
  .prayer-emblem{width:49px;height:49px;border-radius:16px 16px 9px 9px}
}
/* استجابة لمسية هادئة بدل وميض المتصفح الأزرق. */
@media (hover:none),(pointer:coarse){
  :where(button,a,summary,[role="button"]):active{opacity:.76;filter:brightness(.82) saturate(.9);transform:translateY(2px) scale(.96)}
  .cell:active{opacity:.84;filter:brightness(.84) saturate(.9);transform:translateY(2px) scale(.94);border-color:var(--state);box-shadow:inset 0 0 0 2px var(--state)}
  .wedge:active{opacity:.48;filter:brightness(.82);stroke-width:2.4px}
}

/* ===== بطاقات الختمات الجارية ===== */
.public-khatmahs{grid-column:1/-1;grid-row:5;position:relative;z-index:2;width:100%;margin-top:clamp(2.2rem,5vw,4rem);text-align:start}
.public-khatmahs-head{display:flex;align-items:end;justify-content:space-between;gap:1rem;margin-bottom:1rem;color:var(--ivory)}
.public-khatmahs-head h2{font-family:var(--ruqaa);font-size:clamp(1.65rem,3vw,2.25rem);font-weight:700}
.public-khatmahs-head p{color:rgba(255,249,234,.62);font-size:.78rem}
.khatmah-kinds{display:grid;gap:1.5rem}
.khatmah-kind{min-width:0}
.khatmah-kind-head{display:flex;align-items:baseline;justify-content:flex-start;flex-wrap:wrap;gap:.2rem .6rem;margin-bottom:.65rem;padding-inline:.15rem}
.khatmah-kind-title{display:flex;align-items:center;gap:.5rem;color:var(--ivory);font-family:var(--ruqaa);font-size:1.08rem}
.khatmah-kind-note{color:rgba(255,249,234,.56);font-size:.66rem}
.khatmah-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(.75rem,1.7vw,1.15rem)}
.khatmah-card{position:relative;min-width:0;display:grid;grid-template-columns:86px minmax(0,1fr);gap:.85rem;align-items:center;padding:1rem;border:1px solid rgba(228,201,128,.27);border-radius:22px;background:linear-gradient(150deg,rgba(255,253,247,.98),rgba(247,240,226,.95));box-shadow:0 20px 42px -30px rgba(0,0,0,.9);overflow:hidden}
.khatmah-card::after{content:"";position:absolute;inset:auto -28px -42px auto;width:105px;height:105px;border:1px solid rgba(192,138,43,.16);border-radius:50%;pointer-events:none}
.card-shamsa{width:86px;height:86px;display:block;overflow:visible}
.card-khatmah-body{min-width:0;position:relative;z-index:1}
.card-khatmah-title{min-height:3.5em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-family:var(--ruqaa);font-size:1.12rem;line-height:1.75;padding-block:.1em;color:var(--brand-strong)}
.card-khatmah-stats{display:flex;flex-wrap:wrap;gap:.25rem .55rem;margin:.38rem 0 .58rem;color:var(--muted);font-size:.68rem}
.card-khatmah-stats b{color:var(--green);font-weight:700}
.card-progress{position:relative;height:6px;margin-bottom:.34rem;border-radius:999px;background:rgba(46,124,151,.15);overflow:hidden}
.card-progress>i{position:absolute;inset-block:0;inset-inline-start:0;display:block;height:100%;border-radius:inherit}
.card-progress>.p-res{background:rgba(46,124,151,.42)}
.card-progress>.p-done{background:linear-gradient(90deg,var(--gold),var(--gold-hi))}
.card-slots{margin-bottom:.62rem;font-size:.65rem;line-height:1.7;color:var(--muted)}
.card-slots b{color:var(--blue);font-weight:700}
.card-slots.full{color:var(--green);font-weight:600}
.card-join{width:100%;min-height:36px;padding:.38rem .65rem;font-size:.72rem}
.access-badge{display:inline-flex;align-items:center;gap:.28rem;margin-bottom:.3rem;padding:.15rem .48rem;border-radius:999px;font-size:.59rem;font-weight:700}
.access-badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.access-badge.public{color:#17604f;background:rgba(71,162,132,.15)}
.access-badge.private{color:#81631d;background:rgba(197,154,74,.16)}
.cards-empty{padding:1.2rem;border:1px dashed rgba(228,201,128,.3);border-radius:18px;color:rgba(255,249,234,.68);text-align:center}
.khatmah-kind .cards-empty{padding:.85rem;font-size:.7rem}
.cards-loading .khatmah-card{min-height:126px;background:linear-gradient(105deg,rgba(255,253,247,.88) 30%,rgba(246,231,196,.72) 45%,rgba(255,253,247,.88) 60%);background-size:220% 100%;animation:cardLoad 1.2s linear infinite}
@keyframes cardLoad{to{background-position:-220% 0}}

/* ===== اختيار نوع الختمة ===== */
.access-picker{margin:0 0 1rem;padding:0;border:0}
.access-picker legend{margin-bottom:.48rem;color:var(--muted);font-size:.78rem;font-weight:700}
.access-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.55rem}
.access-option{position:relative;display:block;cursor:pointer}
.access-option input{position:absolute;opacity:0;pointer-events:none}
.access-option-body{display:block;height:100%;padding:.72rem .78rem;border:1px solid var(--line);border-radius:15px;background:var(--paper2);transition:border-color .18s,box-shadow .18s,background .18s,transform .18s}
.access-option-body b{display:flex;align-items:center;gap:.4rem;color:var(--brand-strong);font-size:.82rem}
.access-option-body b::before{content:"";width:8px;height:8px;border:1px solid var(--gold);border-radius:50%;box-shadow:inset 0 0 0 2px var(--paper2)}
.access-option-body small{display:block;margin-top:.24rem;color:var(--muted);font-size:.61rem;line-height:1.55}
.access-option input:checked+.access-option-body{border-color:var(--gold);background:var(--gold-soft);box-shadow:0 0 0 2px rgba(192,138,43,.12)}
.access-option input:checked+.access-option-body b::before{background:var(--gold)}
.access-option input:focus-visible+.access-option-body{outline:2px solid var(--blue);outline-offset:2px}
.access-option:active .access-option-body{transform:scale(.985)}

/* ===== السجل التاريخي للقارئ ===== */
.history-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem;margin:1rem 0}
.history-stat{padding:.75rem .45rem;border:1px solid var(--line);border-radius:14px;background:var(--paper2);text-align:center}
.history-stat b{display:block;font-family:var(--naskh);font-size:1.35rem;color:var(--gold)}
.history-stat span{display:block;color:var(--muted);font-size:.66rem}
.history-rounds{display:grid;gap:.7rem;max-height:min(48vh,430px);overflow:auto;padding-inline-end:.15rem}
.history-round{padding:.85rem;border:1px solid rgba(192,138,43,.22);border-radius:16px;background:#fffdf8}
.history-round h4{margin-bottom:.5rem;color:var(--brand-strong);font-size:.84rem}
.history-parts{display:flex;flex-wrap:wrap;gap:.38rem}
.history-part{display:grid;place-items:center;width:32px;height:32px;border:1px solid rgba(192,138,43,.35);border-radius:10px;color:var(--walnut);background:var(--gold-soft);font-family:var(--naskh);font-size:.9rem}

@media (max-width:900px){
  .khatmah-cards{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:680px){
  .public-khatmahs{margin-top:2rem}
  .public-khatmahs-head{align-items:center;margin-bottom:.75rem}
  .public-khatmahs-head h2{font-size:1.45rem}
  .public-khatmahs-head p{max-width:16ch;font-size:.62rem;line-height:1.5}
  .khatmah-kinds{gap:1.2rem}
  .khatmah-kind-head{display:block}
  .khatmah-kind-title{font-size:.96rem}
  .khatmah-kind-note{display:block;margin-top:.08rem;font-size:.57rem}
  .khatmah-cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:.55rem}
  .khatmah-card{display:block;padding:.72rem;border-radius:16px}
  .card-shamsa{display:none}
  .card-khatmah-title{min-height:2.8em;font-size:.92rem}
  .card-khatmah-stats{display:grid;grid-template-columns:1fr;margin:.28rem 0 .5rem;font-size:.59rem;line-height:1.45}
  .card-progress{margin-bottom:.55rem}
  .card-join{min-height:34px;padding:.32rem .4rem;font-size:.64rem}
  .history-summary{gap:.35rem}
  .history-stat{padding:.6rem .25rem}
  .history-stat b{font-size:1.12rem}
  .history-stat span{font-size:.58rem}
  .access-option-body{padding:.65rem .58rem}
  .access-option-body small{font-size:.56rem}
}


/* ═══ ضبط نهائي لاسم المشارك ═══
   الاسم في شريط المستخدم والاسم الأوسط أثناء التمرير يستخدمان
   الخط نفسه دائمًا، كي لا يحدث تبدّل لحظي عند العودة إلى أعلى الصفحة. */
.userbar .user-name{
  font-family:var(--sans)!important;
  font-size:.92rem!important;
  font-weight:650!important;
  line-height:1.45;
}
.tb-user{
  font-family:var(--sans)!important;
  font-size:.92rem!important;
  font-weight:650!important;
  line-height:1.45;
}
/* «ختماتي» في الرئيسية تبقى بطابع العنوان كما اتُّفق سابقًا. */
body.show-home-mine .tb-user{
  font-family:var(--ruqaa)!important;
  font-size:1.02rem!important;
  font-weight:700!important;
}
body.show-top-user .tb-user{
  font-family:var(--sans)!important;
  font-size:.92rem!important;
  font-weight:650!important;
}
@media (max-width:680px){
  .userbar .user-name,.tb-user{font-size:.82rem!important}
  body.show-home-mine .tb-user{font-size:1rem!important}
  body.show-top-user .tb-user{font-size:.82rem!important}
}
@media (max-width:390px){
  .userbar .user-name,.tb-user{font-size:.79rem!important}
  body.show-home-mine .tb-user{font-size:.96rem!important}
  body.show-top-user .tb-user{font-size:.79rem!important}
}

/* ═══ فتح لوح الجزء بسلاسة على الحاسب ═══
   لا نغيّر الشكل أو المحتوى: نزيل فقط blur الحي عن كامل الشاشة أثناء
   الحركة، ونحرّك اللوح بطبقة مركّبة مستقلة بدل إعادة رسم الصفحة خلفه. */
@media (min-width:681px){
  .scrim{
    background:rgba(2,19,17,.72)!important;
    backdrop-filter:none!important;
    -webkit-backdrop-filter:none!important;
    animation:zkScrimIn .15s ease-out both!important;
    will-change:opacity;
  }
  .modal{
    background:rgba(2,19,17,.72)!important;
    backdrop-filter:none!important;
    -webkit-backdrop-filter:none!important;
  }
  .sheet{
    animation:zkPanelIn .22s cubic-bezier(.2,.82,.24,1) both!important;
    will-change:transform;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    transform:translate3d(0,0,0);

const ptReady=()=>typeof adhan!=="undefined";
function ptGet(){try{const v=JSON.parse(localStorage.getItem(PT_KEY));return v&&v.lat!=null?v:null;}catch(e){return null;}}
function ptSave(v){try{localStorage.setItem(PT_KEY,JSON.stringify(v));}catch(e){}}

/* نبني تاريخ الحساب في المنطقة المختارة، لا في منطقة جهاز المستخدم. */
function dateISOInZone(date,tz){
  const parts=new Intl.DateTimeFormat("en-CA",{
    timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit"
  }).formatToParts(date||new Date());
  const values=Object.fromEntries(parts
    .filter(p=>p.type!=="literal").map(p=>[p.type,p.value]));
  return `${values.year}-${values.month}-${values.day}`;
}
const dateForZone=(date,tz)=>new Date(dateISOInZone(date||new Date(),tz)+"T12:00:00");

function ptTimes(cfg,when){
  const p=adhan.CalculationMethod[cfg.method]();
  p.madhab=adhan.Madhab[cfg.madhab==="Hanafi"?"Hanafi":"Shafi"];
  return new adhan.PrayerTimes(
    new adhan.Coordinates(cfg.lat,cfg.lng),dateForZone(when,cfg.tz),p);
}
/* التوقيت يُعرض بساعة المدينة المختارة لا بساعة الجهاز */
function ptFmt(d,tz){
  const s=new Intl.DateTimeFormat("en-GB",
    {timeZone:tz,hour:"2-digit",minute:"2-digit",hour12:false}).format(d);
  const [h,m]=s.split(":").map(Number);
  return fmtTime(h,m);
}
/* الصلاة القادمة: إن مضى العشاء فهي فجر الغد */
function ptNext(cfg){
  const t=ptTimes(cfg), now=Date.now();
  for(const k of PT_ORDER) if(t[k].getTime()>now) return {key:k,at:t[k],today:true};
  const tm=ptTimes(cfg,new Date(Date.now()+864e5));
  return {key:"fajr",at:tm.fajr,today:false};
}

/* ── الوقت المتبقّي بصيغة عربية سليمة (تثنية وجمع) ── */
function arCount(n,one,two,few,many){
  return n===1?one : n===2?two : (n>=3&&n<=10)?`${ar(n)} ${few}` : `${ar(n)} ${many}`;
}
function arDur(mins,tight){
  mins=Math.max(0,Math.round(mins));
  const h=Math.floor(mins/60), m=mins%60;
  const M=()=>arCount(m,"دقيقة","دقيقتين","دقائق","دقيقة");
  const H=()=>arCount(h,"ساعة","ساعتين","ساعات","ساعة");
  if(!h) return m?M():"أقلّ من دقيقة";
  /* الدقائق تُذكر ما دام الوقت قريبًا، فإذا بَعُد كفت الساعات */
  if(h<2&&m) return `${H()} و${M()}`;
  if(!tight&&m) return `${H()} و${M()}`;
  return H();
}
/* دقائق اليوم بساعة المدينة المختارة لا بساعة الجهاز */
/* الصلاة القائم وقتها الآن. بين الشروق والظهر لا فريضة، فلا تعليم. */
function ptCurrent(cfg){
  const t=ptTimes(cfg), now=Date.now();
  for(const k of ["isha","maghrib","asr","dhuhr","sunrise","fajr"])
    if(t[k].getTime()<=now) return k==="sunrise"?null:k;
  return "isha";   /* قبل الفجر: وقت العشاء ممتدّ من ليلة أمس */
}
const ptNextLabel=cfg=>{
  const n=ptNext(cfg);
  return `${PT_NAMES[n.key]} بعد ${arDur((n.at-Date.now())/6e4,true)}`;
};

function ptLine(){
  if(!ptReady()) return "";
  return `<button class="prayer-fab" id="btn-prayer">
    <span class="pt-icon">${PRAYER_ICON}</span>
    <span class="pt-label">مواقيت الصلاة</span></button>`;
}

function ptNextLine(){
  if(!ptReady()) return "";
  const cfg=ptGet();
  let tail=`<span class="pt-next pt-ask">حدّد مدينتك</span>`;
  if(cfg){ try{ tail=`<span class="pt-next">${ptNextLabel(cfg)}</span>`; }catch(e){ tail=""; } }
  return `<div class="next-prayer">${PRAYER_ICON}${tail}</div>`;
}

function prayerDialog(){
  if(!ptReady()) return toast("تعذّر تحميل حاسبة المواقيت");
  const cfg=ptGet();
  if(!cfg) return ptSetupDialog();
  let t,cur;
  try{ t=ptTimes(cfg); cur=ptCurrent(cfg); }
  catch(e){ return ptSetupDialog(); }
  const rows=PT_ORDER.map(k=>{
    const cls=(k==="sunrise"?" sun":"")+(k===cur?" now":"");
    return `<div class="ptrow${cls}">
      <span class="pn">${PT_NAMES[k]}${k===cur?'<span class="tag j">وقتها الآن</span>':""}</span>
      <span class="pv">${ptFmt(t[k],cfg.tz)}</span></div>`;
  }).join("");
  const today=dateISOInZone(new Date(),cfg.tz);
  modal(`<div class="prayer-emblem">${PRAYER_ICON}</div><div class="display" style="font-size:1.45rem">مواقيت الصلاة</div>
    <div class="prayer-head">
      <p class="ptcity">${esc(cfg.city)}</p>
      <div class="prayer-date">
        <span class="prayer-date-g">${esc(fmtClockG(today))}</span>
        <span class="prayer-date-h">${esc(fmtClockH(today))}</span>
      </div>
    </div>
    <div class="ptable">${rows}</div>
    <div class="actions">
      <button class="btn" id="pt-edit">الإعدادات</button>
      <button class="btn quiet spacer" id="pt-close">إغلاق</button>
    </div>`,"prayer-times-modal");
  document.getElementById("pt-edit").onclick=ptSetupDialog;
  document.getElementById("pt-close").onclick=closeLayer;
}

/* نبضة كل نصف دقيقة: تُحدَّث الأرقام والعقرب وحدها بلا إعادة رسم */
function ptTick(){
  const cfg=ptGet(); if(!cfg||!ptReady()) return;
  try{
    const el=document.querySelector(".next-prayer .pt-next");
    if(el&&!el.classList.contains("pt-ask")) el.textContent=ptNextLabel(cfg);
  }catch(e){}
}

function ptSetupDialog(){
  const cur=ptGet();
  let li=cur?PT_LANDS.findIndex(L=>L[0]===cur.land):-1;
  if(li<0) li=0;
  let ci=cur?PT_LANDS[li][3].findIndex(c=>c[0]===cur.city):-1;
  if(ci<0) ci=0;
  let method=cur?cur.method:PT_LANDS[li][2];
  let madhab=cur&&cur.madhab==="Hanafi"?"Hanafi":"Shafi";
  /* لا تُبدَّل الطريقة تلقائيًّا إن كان القارئ قد اختارها بنفسه */
  let touched=!!(cur&&cur.method!==PT_LANDS[li][2]), adv=false;

  const draw=()=>{
    const L=PT_LANDS[li];
    const lands=PT_LANDS.map((x,i)=>`<option value="${i}"${i===li?" selected":""}>${x[0]}</option>`).join("");
    const cities=L[3].map((c,i)=>`<option value="${i}"${i===ci?" selected":""}>${c[0]}</option>`).join("");
    const meths=Object.keys(PT_METHODS).map(k=>
      `<option value="${k}"${k===method?" selected":""}>${PT_METHODS[k]}</option>`).join("");
    modal(`<div class="display" style="font-size:1.45rem">مواقيت الصلاة</div>
      <p class="hint" style="text-align:center;margin:.3rem 0 1.1rem">
        اختر مدينتك، فتُحسب المواقيت على جهازك.</p>
      <div class="field-row"><label>البلد</label>
        <select class="field" id="pt-land">${lands}</select></div>
      <div class="field-row"><label>المدينة</label>
        <select class="field" id="pt-city">${cities}</select></div>
      <div class="field-row"><label>المذهب — يؤثّر في وقت العصر وحده</label>
        <select class="field" id="pt-madhab">
          <option value="Shafi"${madhab==="Shafi"?" selected":""}>الجمهور: الشافعي والمالكي والحنبلي</option>
          <option value="Hanafi"${madhab==="Hanafi"?" selected":""}>الحنفي</option>
        </select></div>
      <details class="ptadv"${adv?" open":""}><summary>إعدادات متقدمة</summary>
        <div class="field-row" style="margin:.5rem 0 0"><label>طريقة الحساب</label>
          <select class="field" id="pt-method">${meths}</select>
          <p class="hint">تُختار تلقائيًّا بحسب البلد، ولا حاجة لتغييرها في الغالب.</p>
        </div>
      </details>
      <div class="actions">
        <button class="btn gold" id="pt-ok">احفظ</button>
        ${cur?'<button class="btn quiet" id="pt-del">أزل المواقيت</button>':""}
        <button class="btn quiet spacer" id="pt-cancel">إلغاء</button>
      </div>`);
    const $=id=>document.getElementById(id);
    $("pt-land").onchange=e=>{
      li=+e.target.value; ci=0;
      if(!touched) method=PT_LANDS[li][2];
      adv=document.querySelector(".ptadv").open;
      draw();
    };
    $("pt-city").onchange=e=>{ci=+e.target.value;};
    $("pt-madhab").onchange=e=>{madhab=e.target.value;};
    $("pt-method").onchange=e=>{method=e.target.value;touched=true;};
    $("pt-ok").onclick=()=>{
      const L2=PT_LANDS[li], c=L2[3][ci];
      ptSave({land:L2[0],city:c[0],lat:c[1],lng:c[2],tz:c[3]||L2[1],method,madhab});
      render(); prayerDialog();
    };
    if($("pt-del")) $("pt-del").onclick=()=>{
      localStorage.removeItem(PT_KEY); closeLayer(); render();
    };
    $("pt-cancel").onclick=closeLayer;
  };
  draw();
}

/* ===================== نداء قاعدة البيانات ===================== */
const pendingRequests=new Map();

async function postJSON(url,payload,options={}){
  const key=options.key||"";
  if(key&&pendingRequests.has(key)) return pendingRequests.get(key);

  const task=(async()=>{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),options.timeout||15000);
    try{
      const r=await fetch(url,{
        method:"POST",
        headers:{"Content-Type":"application/json",...(options.headers||{})},
        body:JSON.stringify(payload||{}),
        signal:controller.signal,
        keepalive:!!options.keepalive
      });
      const text=await r.text();
      let data=null;
      if(text){
        try{ data=JSON.parse(text); }
        catch(e){ if(r.ok) throw new Error("Invalid JSON"); }
      }
      if(!r.ok){
        const err=new Error((data&&data.error)||text||("HTTP "+r.status));
        err.status=r.status;
        /* إن طلب الخادم الانتظار (خصوصًا 429) نحترم Retry-After. */
        const retryAfter=r.headers&&r.headers.get?r.headers.get("Retry-After"):null;
        if(retryAfter){
          const seconds=Number(retryAfter),at=Date.parse(retryAfter);
          err.retryAfter=Number.isFinite(seconds)
            ?Math.max(0,seconds*1000)
            :Number.isFinite(at)?Math.max(0,at-Date.now()):0;
        }
        throw err;
      }
      return data;
    }finally{ clearTimeout(timer); }
  })();

  if(key) pendingRequests.set(key,task);
  try{ return await task; }
  finally{ if(key&&pendingRequests.get(key)===task) pendingRequests.delete(key); }
}

const RPC_HEADERS={apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY};
const DEVICE_LOCK_ERRS=["مقفول على جهاز صاحبه","هذا السجل لصاحب الحساب فقط"];
let rebinding=null;

/* من دخل قبل ترحيل قفل الجهاز يبقى جهازه غير مسجَّل في القاعدة،
   فتُردّ أفعاله كلّها. نربط الجهاز مرّة ثم نعيد الفعل، فلا يُضطرّ
   القارئ إلى الخروج والعودة. وإن كان الاسم مقفولًا على جهاز آخر
   حقًّا، أخفق التسجيل وبقي الرفض على حاله. */
async function rebindDevice(){
  if(rebinding) return rebinding;
  rebinding=(async()=>{
    try{
      const r=await postJSON(`${SUPABASE_URL}/rest/v1/rpc/sign_in`,
        {p_code:code,p_id:viewer.id,p_name:viewer.name,
         p_device:deviceId(),p_org_code:orgCode()},
        {headers:RPC_HEADERS});
      return !!(r&&r.ok);
    }catch(e){ return false; }
  })();
  const out=await rebinding;
  rebinding=null;
  return out;
}

async function rpc(fn, args){
  const body=args||{};
  const call=()=>postJSON(`${SUPABASE_URL}/rest/v1/rpc/${fn}`,body,{
    headers:RPC_HEADERS,
    key:`rpc:${fn}:${JSON.stringify(body)}`
  });
  const r=await call();
  const locked=r&&r.ok===false&&typeof r.error==="string"
    &&DEVICE_LOCK_ERRS.some(m=>r.error.indexOf(m)!==-1);
  if(locked&&fn!=="sign_in"&&viewer&&code&&await rebindDevice()) return call();
  return r;
}

/* ═══════════ مطابقة الأسماء ═══════════
   المنهج المعتمد لأسماء الأشخاص: Jaro-Winkler لا مسافة التحرير،
   لأنها تكافئ تطابق أوائل الحروف وتتسامح مع تبادل موضعين،
   وأكثر اختلاف الأسماء العربية يقع في آخرها (ة/ا، ى/ي).
   ويُضاف إليها تفكيك الاسم إلى كلمات، لأن الكنية تُزاد وتُنقص. */

function jaro(a,b){
  if(a===b) return 1;
  const la=a.length, lb=b.length;
  if(!la||!lb) return 0;
  const win=Math.max(0,Math.floor(Math.max(la,lb)/2)-1);
  const ma=new Array(la).fill(false), mb=new Array(lb).fill(false);
  let m=0;
  for(let i=0;i<la;i++){
    const lo=Math.max(0,i-win), hi=Math.min(i+win+1,lb);
    for(let j=lo;j<hi;j++){
      if(mb[j]||a[i]!==b[j]) continue;
      ma[i]=mb[j]=true; m++; break;
    }
  }
  if(!m) return 0;
  let t=0, k=0;
  for(let i=0;i<la;i++){
    if(!ma[i]) continue;
    while(!mb[k]) k++;
    if(a[i]!==b[k]) t++;
    k++;
  }
  t/=2;
  return (m/la + m/lb + (m-t)/m)/3;
}

/* مكافأة البادئة، بحدّ أربعة أحرف كما في الصيغة المعتمدة */
function jw(a,b){
  const j=jaro(a,b);
  if(j<0.7) return j;
  let p=0;
  while(p<4 && p<a.length && p<b.length && a[p]===b[p]) p++;
  return j + p*0.1*(1-j);
}

/* كلمات لا تميّز صاحبها، فلا يُبنى عليها تشابه */
const KUNYA=new Set(["ام","ابو","ابن","بنت","بن","ابي","عبد","ال","الحاج","الحاجه","الشيخ","دكتور"]);

const tokensOf=s=>araNorm(s).split(/\s+/).filter(t=>t.length>=2);
const coreTokens=s=>tokensOf(s).filter(t=>!KUNYA.has(t));

/* درجة التشابه بين اسمين: صفر إلى واحد */
function nameScore(a,b){
  const ka=keyOf(a), kb=keyOf(b);
  if(ka===kb) return 1;

  /* كلمة مميّزة مشتركة: «محمد» و«أم محمد»، «رضوان» و«رضوان أحمد» */
  const ta=coreTokens(a), tb=coreTokens(b);
  for(const x of ta) for(const y of tb)
    if(x.length>=3 && x===y) return 0.95;

  /* وإلا فمقارنة الاسم كاملًا، ثم أقرب كلمتين فيه */
  let best=jw(ka,kb);
  for(const x of ta) for(const y of tb)
    if(x.length>=3&&y.length>=3) best=Math.max(best, jw(x,y)*0.96);
  return best;
}

/* العتبة: العتبات الشائعة بين ٠٫٨٠ و٠٫٩٠، واخترنا ٠٫٨٧
   لأن الاقتراح يُعرض ولا يُفرض، فالتساهل اليسير أهون من التفويت */
const NEAR=0.87;

function similarTo(typed,members){
  return (members||[])
    .map(m=>({m,s:nameScore(typed,m.name)}))
    .filter(x=>x.s>=NEAR && x.m.id!==keyOf(typed))
    .sort((x,y)=>y.s-x.s)
    .slice(0,3)
    .map(x=>x.m);
}

const OUTBOX_TTL=7*864e5;             /* وبعد أسبوع يسقط العمل مهما كان */
const OUTBOX_BASE_DELAY=30000;
const OUTBOX_MAX_DELAY=6*3600000;

function outboxDrop(id){
  const rest=outboxGet().filter(j=>j.id!==id);
  outboxPut(rest);
}
function outboxRetryable(status){
  if(!Number.isFinite(status)) return true;       /* شبكة، مهلة، أو رفض منطقي */
  if(status>=500) return true;
  return status===408||status===409||status===425||status===429;
}
function outboxDelay(tries,retryAfter){
  const exp=Math.min(OUTBOX_MAX_DELAY,
    OUTBOX_BASE_DELAY*Math.pow(2,Math.min(Math.max(0,tries-1),10)));
  const jitter=Math.round(exp*(.85+Math.random()*.3));
  return Math.max(Number(retryAfter)||0,jitter);
}
function outboxPostpone(id,error){
  const list=outboxGet(),item=list.find(j=>j.id===id);
  if(!item) return;
  item.tries=(item.tries||0)+1;
  item.nextAttemptAt=Date.now()+outboxDelay(item.tries,error&&error.retryAfter);
  outboxPut(list);
}
async function flushOutbox(){
  if(outboxBusy||navigator.onLine===false) return;
  outboxBusy=true;
  try{
    const now=Date.now();
    let jobs=outboxGet();
    const fresh=jobs.filter(j=>now-(j.createdAt||now)<OUTBOX_TTL);
    if(fresh.length!==jobs.length) outboxPut(fresh);   /* أُسقط ما شاخ */

    for(const job of fresh){
      if((job.nextAttemptAt||0)>Date.now()) continue;
      try{
        const result=await edge(job.fn,job.body,
          {key:`outbox:${job.id}`,keepalive:true});
        /* وظائف Edge الحالية قد تعيد HTTP 200 مع ok:false؛
           نجاح النقل ليس نجاح العملية نفسها. */
        if(!result||result.ok!==true){
          const err=new Error((result&&result.error)||"Edge operation failed");
          if(result&&Number.isFinite(Number(result.status))) err.status=Number(result.status);
          throw err;
        }
        /* نجاح الطلب لا يكفي إذا بقي مستقبِل لم تصله الرسالة. */
        if(Number(result.failed)>0){
          const err=new Error("بقيت رسائل لم تصل");
          err.status=503;
          throw err;
        }
        outboxDrop(job.id);
      }catch(e){
        const status=Number(e&&e.status);
        if(!outboxRetryable(status)){ outboxDrop(job.id); continue; }
        outboxPostpone(job.id,e);
        /* انقطاع الشبكة غالبًا يصيب كل الأعمال؛ لا نطرقها كلها في النبضة نفسها. */
        if(!Number.isFinite(status)) break;
      }
    }
  }finally{ outboxBusy=false; }
}

/* عودة الشبكة سبب كافٍ لإسقاط تأجيل المحاولة السابق وإيقاظ الطابور فورًا. */
function outboxWake(){
  const list=outboxGet();
  if(list.length){
    list.forEach(job=>{job.nextAttemptAt=0;job.tries=0;});
    outboxPut(list);
  }
  flushOutbox();
}

/* ===================== الشمسة ===================== */
function shamsa(){
  const cx=160,cy=160,r1=76,r2=126,n=30,step=360/n,gap=1.5;
  const pt=(r,d)=>{const a=d*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  let w="";
  for(let i=0;i<n;i++){
    const a1=-90+i*step+gap/2,a2=-90+(i+1)*step-gap/2;
    const[x1,y1]=pt(r2,a1),[x2,y2]=pt(r2,a2),[x3,y3]=pt(r1,a2),[x4,y4]=pt(r1,a1);
    const s=state.juz[i].status;
    const fill=s==="done"?"url(#g)":s==="taken"?"#B9DED2":"#DCEDF3";
    const st=s==="done"?"#C99A45":s==="taken"?"#287A65":"#2E7C97";
    w+=`<path class="wedge" data-i="${i}" style="animation-delay:${i*18}ms"
      d="M${x1} ${y1}A${r2} ${r2} 0 0 1 ${x2} ${y2}L${x3} ${y3}A${r1} ${r1} 0 0 0 ${x4} ${y4}Z"
      fill="${fill}" stroke="${st}" stroke-width="1.1"><title>الجزء ${i+1}</title></path>`;
  }
  const done=state.juz.filter(j=>j.status==="done").length;
  return `<svg class="shamsa" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img"
      aria-label="تمّت قراءة ${done} من ثلاثين جزءًا">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8E9C4"/><stop offset="1" stop-color="#E5C06B"/></linearGradient></defs>
    <circle cx="160" cy="160" r="142" fill="none" stroke="#C99A45" stroke-opacity=".42"/>
    <circle cx="160" cy="160" r="136" fill="none" stroke="#C99A45" stroke-opacity=".2"/>
    ${w}
    <circle cx="160" cy="160" r="68" fill="#FFFCF4" stroke="#C99A45" stroke-opacity=".5"/>
    <circle cx="160" cy="160" r="62" fill="none" stroke="#C99A45" stroke-opacity=".27"/>
    <text x="160" y="152" text-anchor="middle" font-family="Amiri,serif" font-size="50" fill="#C99A45">${ar(done)}</text>
    <text x="160" y="184" text-anchor="middle" font-family="Amiri,serif" font-size="19" fill="#8A7657">من ٣٠ جزءًا</text>
  </svg>`;
}

function cardShamsa(done,reserved){
  let rays="";
  for(let i=0;i<30;i++){
    const color=i<done?"#C59A4A":i<reserved?"#2C8B6C":"#8CB5C0";
    const opacity=i<reserved?1:.42;
    rays+=`<path d="M60 10V24" transform="rotate(${i*12} 60 60)"
      stroke="${color}" stroke-opacity="${opacity}" stroke-width="4.2" stroke-linecap="round"/>`;
  }
  return `<svg class="card-shamsa" viewBox="0 0 120 120" aria-hidden="true">
    <circle cx="60" cy="60" r="55" fill="#FFFCF4" stroke="#C59A4A" stroke-opacity=".26"/>
    ${rays}
    <circle cx="60" cy="60" r="27" fill="#0A473E" stroke="#E4C980" stroke-width="1.4"/>
    <text x="60" y="66" text-anchor="middle" font-family="Amiri,serif" font-size="23" fill="#FFF9EA">${ar(done)}</text>
  </svg>`;
}

function participantWord(n){
  if(n===1) return "مشارك";
  if(n===2) return "مشاركان";
  if(n>=3&&n<=10) return "مشاركين";

}

const pct=n=>Math.max(0,Math.min(100,(Number(n)||0)/30*100));

function khatmahCardsGroup(accessType,title,note){
  const items=publicKhatmahs.filter(k=>

  const cards=items.length?`<div class="khatmah-cards">${items.map(k=>{
    const done=Number(k.doneCount)||0,reserved=Number(k.reservedCount)||0;
    const people=Number(k.participantCount)||0,overdue=daysLeft(k.endDate)<0;

    `<div class="cards-empty">${accessType==="public"
      ?"لا توجد ختمة عامة جارية الآن."

  menu.hidden=false;btn.setAttribute("aria-expanded","true");
}
function toggleTopMenu(){
  const menu=document.getElementById("tb-popover"),btn=document.getElementById("tb-user");
  if(!menu||!btn||!btn.textContent.trim()) return;
  if(!menu.hidden){closeTopMenu();return;}
  showTopMenu(screen==="home"?"mine":"account");
}
function syncTopUser(){
  const topUser=document.getElementById("tb-user");
  if(!topUser) return;
  closeTopMenu();
  if(topUserObserver){topUserObserver.disconnect();topUserObserver=null;}
  document.body.classList.remove("show-top-user","show-home-mine");
  topUser.textContent="";
  topUser.disabled=true;

  if(screen==="home"){
    if(mineGet().length){
      topUser.textContent="ختماتي";topUser.disabled=false;
      document.body.classList.add("show-home-mine");
    }
    return;
  }
  if(!(viewer&&screen==="main")) return;
  topUser.textContent=viewer.name;topUser.disabled=false;
  const bar=document.getElementById("main-userbar");
  if(!bar) return;
  topUserObserver=new IntersectionObserver(entries=>{
    const entry=entries[0];
    const show=!entry.isIntersecting&&entry.boundingClientRect.top<64;
    document.body.classList.toggle("show-top-user",show);
    if(!show) closeTopMenu();
  },{root:null,rootMargin:"-64px 0px 0px 0px",threshold:0});
  topUserObserver.observe(bar);
}
function queueTopUserSync(){
  cancelAnimationFrame(topUserResizeFrame);
  topUserResizeFrame=requestAnimationFrame(syncTopUser);
}

/* نافذة تأكيد موحّدة: نفس modal/frame والعناوين والأزرار المستعملة في التطبيق. */
function appConfirm(message,{title="تأكيد",ok="متابعة",cancel="إلغاء",danger=false}={}){
  return new Promise(resolve=>{
    const host=document.createElement("div");
    host.className="modal app-confirm-overlay";
    host.setAttribute("role","presentation");
    host.innerHTML=`<div class="frame app-confirm-card" role="dialog" aria-modal="true" aria-labelledby="app-confirm-title">
      <div class="display" id="app-confirm-title" style="font-size:1.4rem">${esc(title)}</div>
      <p class="hint app-confirm-copy" style="margin:.7rem 0 1.1rem;line-height:2">${esc(message)}</p>
      <div class="actions">
        <button class="btn ${danger?"danger":"gold"}" data-confirm-ok>${esc(ok)}</button>
        <button class="btn quiet" data-confirm-cancel>${esc(cancel)}</button>
      </div>
    </div>`;
    document.body.appendChild(host);
    const okBtn=host.querySelector("[data-confirm-ok]");
    const cancelBtn=host.querySelector("[data-confirm-cancel]");
    let settled=false;
    const done=value=>{
      if(settled) return;
      settled=true;
      document.removeEventListener("keydown",onKey,true);
      host.remove();
      resolve(value);
    };
    const onKey=e=>{
      if(e.key==="Escape"){e.preventDefault();done(false);}
    };
    okBtn.onclick=()=>done(true);
    cancelBtn.onclick=()=>done(false);
    host.onclick=e=>{if(e.target===host)done(false);};
    document.addEventListener("keydown",onKey,true);
    requestAnimationFrame(()=>okBtn.focus({preventScroll:true}));
  });
}

/* بديل داخلي لـ prompt، بنفس نافذة التطبيق القياسية. */
function appCopyFallback(title,value){
  return new Promise(resolve=>{
    const host=document.createElement("div");
    host.className="modal app-confirm-overlay";
    host.innerHTML=`<div class="frame app-confirm-card" role="dialog" aria-modal="true" aria-labelledby="app-copy-title">
      <div class="display" id="app-copy-title" style="font-size:1.4rem">${esc(title)}</div>
      <p class="hint" style="margin:.7rem 0 .9rem;line-height:2">تعذّر النسخ التلقائي. حدّد النص وانسخه من هنا.</p>
      <textarea class="app-copy-box" readonly>${esc(value)}</textarea>
      <div class="actions" style="margin-top:1rem">
        <button class="btn gold" data-copy-close>حسنًا</button>
      </div>
    </div>`;
    document.body.appendChild(host);
    const ta=host.querySelector("textarea");
    const close=()=>{host.remove();resolve();};
    host.querySelector("[data-copy-close]").onclick=close;
    host.onclick=e=>{if(e.target===host)close();};
    requestAnimationFrame(()=>{ta.focus({preventScroll:true});ta.select();});
  });
}

async function joinKhatmahCard(publicId){
  const item=publicKhatmahs.find(k=>k.publicId===publicId);
  if(!item) return;
  if(item.accessType==="public"){
    toast("جارٍ فتح الختمة…");
    let publicCode;
    try{publicCode=await rpc("open_public_khatmah",{p_public_id:publicId});}
    catch(e){return toast("تعذّر فتح الختمة الآن");}
    if(!publicCode) return toast("لم تعد هذه الختمة متاحة");
    zkReplaceHash(String(publicCode).toUpperCase());boot();return;
  }
  modal(`<div class="display" style="font-size:1.35rem">${esc(item.title)}</div>
    <p class="hint" style="margin:.55rem 0 1rem">أدخل رمز هذه الختمة للانضمام إليها.</p>
    <div class="field-row"><input id="card-code" class="field codebox" maxlength="4"
      autocomplete="off" inputmode="text" placeholder="ABCD"></div>
    <div class="actions"><button class="btn gold" id="card-go">انضمام</button>
      <button class="btn quiet" id="card-no">إلغاء</button></div>`);
  const field=document.getElementById("card-code");
  const go=async()=>{
    const c=norm(field.value).toUpperCase();
    if(c.length!==4) return toast("الرمز أربعة محارف");
    let matches=false;
    try{matches=await rpc("match_khatmah_code",{p_public_id:publicId,p_code:c});}
    catch(e){return toast("تعذّر التحقق من الرمز");}
    if(!matches) return toast("هذا الرمز لا يخصّ الختمة المختارة");
    closeLayer();zkReplaceHash(c);boot();
  };
  document.getElementById("card-go").onclick=go;
  document.getElementById("card-no").onclick=closeLayer;
  field.onkeydown=e=>{if(e.key==="Enter")go();};
  field.focus();
}

    <p class="hint" style="margin:.8rem 0">جارٍ جمع ما قرأت عبر دورات هذه الختمة…</p>`);

  document.getElementById("history-close").onclick=closeLayer;
}

/* ===================== البيانات ===================== */
let refreshSeq=0;
async function refresh(silent=false){
  if(!code) return false;
  const seq=++refreshSeq;
  let nextState;
  try{ nextState=await rpc("get_state",{p_code:code}); }
  catch(e){
    if(seq===refreshSeq&&!silent) toast("تعذّر الاتصال بقاعدة البيانات");
    return false;
  }
  /* لا تسمح لاستجابة أقدم أن تمحو حالة جلب أحدث. */
  if(seq!==refreshSeq) return false;
  state=nextState;
  if(!state){ activeKhatmahForget(code); screen="notfound"; if(!silent) render(); return true; }
  if(viewer && !memberOf(viewer.id)){ /* حُذف أو دُمج */ viewer=null; localStorage.removeItem(vKey()); }
  if(screen!=="linking"){
    const me=viewer?memberOf(viewer.id):null;
    /* الربط شرط للدخول، ويُستثنى المنظّم ومن أُذن له */
    /* الربط شرط للدخول، ويلزم المشرف كما يلزم غيره */
    if(me && !me.linked && !me.exempt){
      /* في الختمة العامة لا يعرف القارئ مشرفها ليأذن له،
         فيُسأل بنفسه بدل أن يُساق إلى تلغرام سوقًا. */
      if(!silent){
        if(state.accessType==="public" && !isOrganizer()) askReminder();
        else startLinking();
        return;
      }
      screen="main";
    } else {
      screen = viewer ? "main" : "gate";
    }
  }
  if(viewer&&state) mineRemember();
  if(!silent) render();
  return true;
}

async function doSignIn(id,name,ocode){
  let r;
  try{ r=await rpc("sign_in",{p_code:code,p_id:id,p_name:name,
        p_device:deviceId(),p_org_code:ocode}); }
  catch(e){ return toast("تعذّر الاتصال"); }
  if(!r||!r.ok){
    if(r&&r.needCode){ gateName=name; screen="gate"; render(); return; }
    if(r&&r.taken) return nameTaken(r.name);
    return toast((r&&r.error)||"تعذّر الدخول");
  }
  viewer={id:r.id,name:r.name};
  localStorage.setItem(vKey(),JSON.stringify(viewer));
  activeKhatmahSet(code,true);
  if(ocode) localStorage.setItem(cKey(),ocode);
  gateName="";
  if(!await refresh(true)){
    screen="gate"; render(); toast("تعذّر الاتصال بقاعدة البيانات"); return;
  }
  const me=memberOf(viewer.id);
  if(me&&!me.linked&&!me.exempt){
    if(state.accessType==="public"&&!isOrganizer()) askReminder();
    else startLinking();
    return;
  }
  render();

/* ===================== تلغرام ===================== */
let lkTimer=null;

/* يفتح البوت ويظلّ يراقب حتى يتمّ التفعيل */
let linking=false;   /* حارس: عملية ربط جارية، فلا يُولَّد رمز ثانٍ */

async function startLinking(force){
  /* كل رمز جديد يمحو ما قبله، فتولّد رمزين على ضغطة واحدة
     يُفشل الربط ويُظهر اعتذارًا بلا سبب. */
  if(linking && !force){ if(screen!=="linking"){ screen="linking"; render(); } return; }
  linking=true;
  screen="linking"; render();
  const opened=await openBot();
  if(!opened) showFallback();
  /* بعد ثوانٍ نعرض المخرج على كل حال، فقد يفشل الفتح صامتًا */
  setTimeout(showFallback,5000);
  clearInterval(lkTimer);
  let tries=0,checking=false;
  lkTimer=setInterval(async()=>{
    if(screen!=="linking"||!viewer){ clearInterval(lkTimer); lkTimer=null; linking=false; return; }
    if(checking) return;
    checking=true;
    tries++;
    try{
      if(!await refresh(true)) return;
      if(!state){ clearInterval(lkTimer); lkTimer=null; linking=false; render(); return; }
      const m=memberOf(viewer.id);
      if(m&&(m.linked||m.exempt)){
        clearInterval(lkTimer); lkTimer=null; linking=false;
        if(justCreated){ justCreated=false; screen="share"; render(); toast("بدأت الختمة"); return; }
        screen="main"; render();
        toast(m.linked?"تم تفعيل التذكير، تقبّل الله":"أذن لك المنظّم بالدخول");
      } else if(tries>=100){ clearInterval(lkTimer); lkTimer=null; linking=false; showFallback(); }
    }finally{ checking=false; }
  },3000);
}

function showFallback(){
  const el=document.getElementById("lk-fallback");
  if(el) el.classList.remove("lk-hidden");
}

/* يولّد رمز ربط ويفتح محادثة البوت. يعيد false إن منع المتصفح الفتح */
async function openBot(){
  /* فتح النافذة داخل ضغطة المستخدم يمنع حاجب النوافذ من رفضها بعد انتظار الشبكة. */
  const w=window.open("about:blank","_blank");
  if(w) w.opener=null;
  let lc;
  try{ lc=await rpc("make_link_code",{p_code:code,p_id:viewer.id,p_device:deviceId()}); }
  catch(e){ if(w) w.close(); return false; }
  if(!lc){ if(w) w.close(); return false; }
  const url=`https://t.me/${BOT_USERNAME}?start=${lc}`;
  if(w){ w.location.replace(url); return true; }
  return false;
}

/* الزر الظاهر في الختمة لمن لم يفعّل، أو لمن حذف البوت */
let linkBusy=false;
async function linkTelegram(){
  if(linkBusy) return;
  linkBusy=true;
  const ok=await openBot();
  toast(ok?"اضغط زر البدء في تلغرام ثم عد إلى هنا":"تعذّر فتح تلغرام");
  if(!ok){ linkBusy=false; return; }
  let n=0,checking=false;
  const t=setInterval(async()=>{
    if(checking) return;
    checking=true;
    n++;
    try{
      if(!await refresh(true)) return;
      if(!state){ clearInterval(t); linkBusy=false; render(); return; }
      const m=memberOf(viewer.id);
      if(m&&m.linked){
        clearInterval(t); linkBusy=false; render(); toast("تم تفعيل التذكير");
      }else if(n>=20){ clearInterval(t); linkBusy=false; }
    }finally{ checking=false; }
  },3000);
}

async function doAssign(num,to){
  try{
    const r=await rpc("assign_juz",{p_code:code,p_org_code:orgCode(),p_num:num,p_to:to,p_device:deviceId()});
    if(!r.ok) return toast(r.error||"تعذّر الإسناد");
    closeLayer(); await refresh();
    toast(r.linked?`أُسنِد إلى ${r.name}`:`أُسنِد إلى ${r.name} — بلّغه بنفسك`);
  }catch(e){ toast("تعذّر الاتصال"); }
}

/* ===================== الأفعال ===================== */
let actionBusy=false;
async function act(a,i){
  const num=i+1;
  const j=state.juz[i];
  const mine=j.ownerId===viewer.id;
  const o=j.ownerId?memberOf(j.ownerId):null;

  /* حين يتصرّف المنظّم في جزء غيره، يُسأل باسم صاحبه صراحةً */
  if(!mine&&o){
    if(a==="done"&&!await appConfirm(`هل أتمّ ${o.name} الجزء ${ar(num)} فعلًا؟\nسيتوقف تذكيره به، وتصله رسالة شكر.`,{title:"تأكيد القراءة",ok:"نعم، أتمّه"})) return;
    if(a==="undone"&&!await appConfirm(`سيعود الجزء ${ar(num)} إلى «لم يُتمّ» باسم ${o.name}، ويعود تذكيره به.`,{title:"إعادة حالة الجزء",ok:"أعده"})) return;
    if(a==="free"&&!await appConfirm(`سيُحرَّر الجزء ${ar(num)} من ${o.name} ويعود متاحًا للجميع.`,{title:"تحرير الجزء",ok:"حرّر الجزء",danger:true})) return;
  }

  if(actionBusy) return;
  actionBusy=true;
  let ownerId=j.ownerId;
  const unreadBefore=state.juz.filter(x=>x.status!=="done").length;
  try{
    try{
      let r;
      if(a==="take")        r=await rpc("claim_juz",{p_code:code,p_id:viewer.id,p_num:num,p_device:deviceId()});
      else if(a==="free")   r=await rpc("release_juz",{p_code:code,p_id:viewer.id,p_num:num,p_org_code:orgCode(),p_device:deviceId()});
      else if(a==="done")   r=await rpc("set_done",{p_code:code,p_id:viewer.id,p_num:num,p_done:true,p_org_code:orgCode(),p_device:deviceId()});
      else if(a==="undone") r=await rpc("set_done",{p_code:code,p_id:viewer.id,p_num:num,p_done:false,p_org_code:orgCode(),p_device:deviceId()});
      if(r&&!r.ok){ await refresh(); return toast(r.error||"تعذّر التنفيذ"); }
      if(r&&r.ownerId) ownerId=r.ownerId;
    }catch(e){ return toast("تعذّر الاتصال"); }

    closeLayer();
    const loaded=await refresh();

    if(a==="done"){
      /* تحفظ الرسالة محليًا إن انقطع الاتصال، ثم تُعاد محاولتها تلقائيًا. */
      enqueueEdge("notify-done",{code,id:ownerId,num},
        `notify:${code}:${state.roundNo||1}:${ownerId}:${num}:done`);
      const left=loaded&&state
        ?state.juz.filter(x=>x.status!=="done").length
        :Math.max(0,unreadBefore-1);
      if(left===0){
        /* اكتملت الثلاثون، فيُبلَّغ الجميع تلقائيًا. */
        enqueueEdge("announce",{kind:"done",code},
          `announce:${code}:${state.roundNo||1}:done`);
      }
      toast(left===0?"تمّت الختمة، تقبّل الله"
        :mine?`تقبّل الله. بقي ${ar(left)} جزءًا`:`سُجّل جزء ${o?o.name:""}`);
    }
  }finally{ actionBusy=false; }
}

     لذلك يبدأ التفعيل وإعادة التفعيل دائمًا باختيار الساعة. */

function handleTopMenuClick(e){
  const mine=e.target.closest("[data-top-mine]");
  if(mine){closeTopMenu();zkReplaceHash(mine.dataset.topMine);boot();return;}
  const action=e.target.closest("[data-top-action]")?.dataset.topAction;
  if(!action) return;
  if(action==="mine"){showTopMenu("mine");return;}
  if(action==="account"){showTopMenu("account");return;}
  closeTopMenu();
  if(action==="history") historyDialog();
  else if(action==="reminder") reminderFromAccountMenu();
  else if(action==="logout") logoutCurrent();
  else if(action==="leave") leaveDialog();
}
